<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101216">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Recap">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Gaming Recap</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#101216; --ink:#F1F5FA; --muted:#A3ADBD; --line:#ffffff12; --glass:#ffffff09; --panel:#181B21; --panel2:#1F232A;
  --acc:#33C3FF; --acc-ink:#0A1C2A; --lime:#33C3FF; --pink:#7C8CFF; --violet:#A97BFF; --cyan:#14F0C8; --orange:#FFB547; --blue:#4C7DFF; --yellow:#FFB547;
  --r:24px; --font:Inter,"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --top:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font)}
body{min-height:100vh;overflow-x:hidden}
a{color:var(--cyan)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:var(--ink);background:#ffffff0f;border:1px solid var(--line);border-radius:14px;padding:11px 14px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--violet)}
select option{background:#181B21}
code{background:#ffffff12;padding:1px 6px;border-radius:6px;font-size:.92em}

/* ---------- Kopf & Navigation ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(12px + var(--top)) 18px 12px;
  background:linear-gradient(#101216f5,#101216c0 70%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.logo{font-weight:900;font-size:22px;letter-spacing:-.5px;white-space:nowrap}
.logo b{background:linear-gradient(90deg,var(--lime),var(--cyan) 45%,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.spacer{flex:1}
.sync{font-size:12px;color:var(--muted);text-align:right;line-height:1.2}
.ibtn{width:40px;height:40px;border-radius:50%;background:var(--glass);border:1px solid var(--line);display:grid;place-items:center;flex:none;position:relative}
.ibtn:hover{border-color:#ffffff40}
.ibtn svg{width:19px;height:19px}
.ibtn .badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--pink);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.deskNav{display:none;gap:4px;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:4px;margin-left:18px}
.deskNav a{padding:8px 16px;border-radius:999px;color:var(--muted);text-decoration:none;font-weight:600}
.deskNav a.on{background:var(--ink);color:var(--bg)}
.tabbar{position:fixed;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));z-index:30;display:flex;
  background:#1A1D24e8;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:24px;padding:5px}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;border-radius:18px;
  color:var(--muted);text-decoration:none;font-size:10.5px;font-weight:700}
.tabbar a svg{width:22px;height:22px}
.tabbar a.on{color:var(--bg);background:var(--ink)}
@media(min-width:1000px){.tabbar{display:none}.deskNav{display:flex}}
.playing{display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:18px;background:#33C3FF18;border:1px solid #33C3FF44;margin-bottom:14px;font-weight:700}
.playing i{width:10px;height:10px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 0 #33C3FFaa;animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 10px #33C3FF00}100%{box-shadow:0 0 0 0 #33C3FF00}}

main{max-width:1240px;margin:0 auto;padding:4px 16px 120px}
@media(min-width:1000px){main{padding:8px 28px 60px}}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase;opacity:.75}
.h1{font-size:clamp(30px,7vw,52px);font-weight:900;letter-spacing:-1.5px;line-height:1;margin:6px 0 18px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 14px}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:9px 16px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-weight:600;font-size:14px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip small{opacity:.6;margin-left:4px}

/* ---------- Bento ---------- */
.bento{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.card{grid-column:span 12;border-radius:var(--r);padding:24px;position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--line)}
@media(min-width:1000px){.s7{grid-column:span 7}.s5{grid-column:span 5}.s6{grid-column:span 6}.s4{grid-column:span 4}.s8{grid-column:span 8}.s3{grid-column:span 3}}
@media(min-width:640px) and (max-width:999px){.m6{grid-column:span 6}}
.card h3{margin:0 0 16px;font-size:13px;font-weight:800;letter-spacing:2px;text-transform:uppercase;opacity:.8}
.reveal{opacity:0;transform:translateY(24px) scale(.98);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}

.hero{min-height:360px;display:flex;flex-direction:column;justify-content:flex-end;padding:30px;border:0;
  background:radial-gradient(60% 80% at 15% 20%,#7C8CFF 0,transparent 60%),radial-gradient(50% 70% at 85% 10%,#A97BFF 0,transparent 60%),
  radial-gradient(60% 80% at 70% 100%,#FFB547 0,transparent 60%),#14122A;background-size:140% 140%;animation:mesh 14s ease-in-out infinite alternate}
@keyframes mesh{0%{background-position:0% 0%}100%{background-position:100% 100%}}
.hero .num{font-size:clamp(84px,24vw,210px);font-weight:900;line-height:.85;letter-spacing:-.06em;margin:10px 0 2px}
.hero .unit{font-size:clamp(22px,5vw,34px);font-weight:800;letter-spacing:-.5px}
.hero .sub{margin-top:10px;font-size:16px;opacity:.9;max-width:560px}
.hstats{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.hstat{background:#0000002e;backdrop-filter:blur(6px);border-radius:18px;padding:10px 16px}
.hstat b{font-size:22px;font-weight:900;display:block;line-height:1.1}
.hstat span{font-size:12px;opacity:.8}

.topg{min-height:340px;padding:0;display:flex;align-items:flex-end;border:0;cursor:pointer}
.topg .bgimg{position:absolute;inset:0}
.topg .bgimg img,.topg .bgimg .ph{width:100%;height:100%;object-fit:cover}
.topg::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#101216 5%,#101216aa 45%,transparent 80%)}
.topg .in{position:relative;z-index:1;padding:26px;width:100%}
.topg .rank1{position:absolute;right:16px;top:10px;z-index:2;font-size:110px;font-weight:900;line-height:1;color:#fff;letter-spacing:-6px;
  text-shadow:4px 4px 0 #000,0 10px 40px #000c}
.topg .t{font-size:clamp(26px,5vw,40px);font-weight:900;letter-spacing:-1px;line-height:1.05;margin:6px 0 8px}

.lime{background:var(--lime);color:#111;border:0}
.pinkc{background:var(--pink);color:#160411;border:0}
.cyanc{background:var(--cyan);color:#04201d;border:0}
.violetc{background:var(--violet);color:#fff;border:0}
.orangec{background:var(--orange);color:#200c00;border:0}
.yellowc{background:var(--yellow);color:#1d1600;border:0}
.big{font-size:clamp(56px,12vw,96px);font-weight:900;letter-spacing:-.05em;line-height:.9}
.mid{font-size:clamp(34px,7vw,52px);font-weight:900;letter-spacing:-1.5px;line-height:1}
.devrow{display:flex;align-items:center;gap:10px;margin-top:12px;font-weight:700}
.devrow .lbl{width:100px}
.devrow .trk{flex:1;height:14px;border-radius:999px;background:#00000022;overflow:hidden}
.devrow .trk div{height:100%;border-radius:999px;background:#111;transition:width 1.2s cubic-bezier(.2,.7,.2,1)}
.devrow .v{width:80px;text-align:right}

.rail{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:6px 0 4px;scroll-snap-type:x mandatory}
.rail::-webkit-scrollbar{display:none}
.rk{flex:none;display:flex;align-items:flex-end;scroll-snap-align:start;cursor:pointer;padding:0 0 46px 26px;position:relative}
.rk .n{position:absolute;left:0;bottom:40px;z-index:2;font-size:70px;font-weight:900;line-height:.8;color:#fff;letter-spacing:-4px;
  text-shadow:3px 3px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,0 8px 24px #000;pointer-events:none}
@media(min-width:1000px){.rk .n{font-size:96px}.rk{padding-left:32px}}
.rk .p{width:130px;position:relative;z-index:1}
@media(min-width:1000px){.rk .p{width:150px}}
.poster{aspect-ratio:2/3;border-radius:16px;overflow:hidden;background:#1F232A;position:relative;box-shadow:0 10px 30px #0008}
.poster img,.poster .ph{width:100%;height:100%;object-fit:cover;display:block}
.poster .ph{display:flex}
.rk .meta{position:absolute;top:100%;left:0;right:0;font-size:13px;margin-top:8px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk .meta span{display:block;color:var(--muted);font-weight:600}
.ph{display:flex;align-items:flex-end;padding:12px;font-weight:900;font-size:16px;line-height:1.1;color:#fff;letter-spacing:-.3px}

.pbar{display:flex;align-items:center;gap:12px;padding:9px 0}
.pbar .dot{width:12px;height:12px;border-radius:50%;flex:none}
.pbar .nm{width:110px;font-weight:700;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar .trk{flex:1;height:10px;border-radius:999px;background:#ffffff10;overflow:hidden}
.pbar .trk div{height:100%;border-radius:999px;transition:width 1.2s cubic-bezier(.2,.7,.2,1)}
.pbar .v{width:76px;text-align:right;font-weight:700;font-size:14px}
.inv .trk{background:#00000020}.inv .trk div{background:#160411}

.cols{display:flex;align-items:flex-end;gap:10px;height:170px;margin-top:10px}
.cols .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.cols .c div{width:100%;border-radius:12px 12px 4px 4px;background:#04201d;transition:height 1.2s cubic-bezier(.2,.7,.2,1);min-height:4px}
.cols .c span{font-size:12px;font-weight:800}
.cols.thin{gap:3px}.cols.thin .c div{border-radius:6px 6px 2px 2px}.cols.thin .c span{font-size:10px}

.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.fact{all:unset;box-sizing:border-box;cursor:pointer;border-radius:20px;padding:16px 16px 14px;min-height:150px;display:flex;flex-direction:column;
  background:linear-gradient(160deg,color-mix(in srgb,var(--a) 16%,#181B21),#13111a 70%);border:1px solid color-mix(in srgb,var(--a) 28%,transparent);transition:transform .2s,border-color .2s}
.fact:hover{transform:translateY(-3px);border-color:var(--a)}
.fact .ft{display:flex;align-items:center;gap:8px}
.fact .ft i{font-style:normal;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--a) 22%,transparent);font-size:16px}
.fact small{font-size:11px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;color:var(--a)}
.fact b{font-size:24px;font-weight:900;letter-spacing:-.6px;line-height:1.1;margin:auto 0 4px;padding-top:12px;word-break:break-word;color:#fff;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fact span{font-size:13px;color:#ffffffb8;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fact em{font-style:normal;font-size:10.5px;font-weight:800;margin-top:10px;align-self:flex-start;padding:2px 8px;border-radius:999px;background:#ffffff10;color:#ffffff99}
.xrow{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:8px 0;border-top:1px solid #ffffff10;cursor:pointer}
.xrow:first-child{border-top:0}.xrow .poster{width:40px;border-radius:8px}
.xrow b{display:block;font-size:14.5px}.xrow span{font-size:12.5px;color:var(--muted)}.xrow em{font-style:normal;font-weight:900;white-space:nowrap}
.calc{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:4px 0 12px;font-weight:900;color:var(--muted)}
.calc>div:has(small){background:#ffffff0b;border-radius:12px;padding:8px 12px;color:var(--ink)}
.calc small{display:block;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}.calc b{font-size:17px}

.ring{--p:0;width:150px;height:150px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--lime) calc(var(--p)*1%),#ffffff1a 0)}
.ring>div{width:118px;height:118px;border-radius:50%;background:var(--panel);display:grid;place-items:center;text-align:center}
.violetc .ring>div{background:var(--violet)}
.ring b{font-size:34px;font-weight:900;line-height:1}
.ring span{font-size:11px;opacity:.75;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 22px;border-radius:999px;font-weight:800;font-size:15px;background:var(--ink);color:var(--bg)}
.btn.ghost{background:var(--glass);color:var(--ink);border:1px solid var(--line)}
.btn.limeb{background:var(--lime);color:#111}
.btn.small{padding:9px 14px;font-size:13.5px}
.btn:disabled{opacity:.5}
.notice{border-radius:20px;padding:14px 18px;background:#ffffff0d;border:1px solid var(--line);margin-bottom:14px;font-size:14px}
.stat3{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:1000px){.stat3{grid-template-columns:repeat(4,1fr)}}
.tile{border-radius:22px;padding:18px;background:var(--panel);border:1px solid var(--line)}
.tile small{display:block;font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.tile b{display:block;font-size:30px;font-weight:900;letter-spacing:-1px;margin-top:6px;line-height:1.05}
.tile span{font-size:13px;color:var(--muted)}

/* ---------- Heatmap ---------- */
.heat i.co.l1{background:#A97BFF40}.heat i.co.l2{background:#A97BFF70}.heat i.co.l3,.legend i.co{background:#A97BFFa8}.heat i.co.l4{background:#A97BFF}
.heat i.ap,.legend i.ap{background-image:repeating-linear-gradient(135deg,#0000 0 2px,#0008 2px 4px)}
.legend i.co,.legend i.ap{width:11px;height:11px;border-radius:3px;vertical-align:middle;margin-right:4px}
.heatwrap{overflow-x:auto;scrollbar-width:thin;padding-bottom:6px}
.heat{display:grid;grid-template-rows:repeat(7,13px);grid-auto-flow:column;grid-auto-columns:13px;gap:3px;width:max-content}
.heat i{border-radius:3px;background:#ffffff0d}
.heat i.l1{background:#33C3FF40}.heat i.l2{background:#33C3FF70}.heat i.l3{background:#33C3FFa8}.heat i.l4{background:#33C3FF}
.heat i.x{background:transparent}
.months{display:grid;grid-auto-flow:column;grid-auto-columns:16px;font-size:11px;color:var(--muted);width:max-content;margin-bottom:6px}
@media(min-width:1000px){.heat{grid-template-rows:repeat(7,17px);grid-auto-columns:17px;gap:4px}.months{grid-auto-columns:21px}}
.legend{display:flex;gap:4px;align-items:center;font-size:11px;color:var(--muted);margin-top:8px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}

/* ---------- Bibliothek ---------- */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.toolbar input[type=search],.toolbar input[type=text]{flex:1;min-width:180px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
@media(min-width:1000px){.grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:20px}}
@media(max-width:480px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}}
.gcard{cursor:pointer}
.gcard .poster::after{content:"";position:absolute;inset:50% 0 0;background:linear-gradient(0deg,#000d,transparent)}
.gcard .ov{position:absolute;left:12px;right:12px;bottom:10px;z-index:1}
.gcard .ov b{display:block;font-size:20px;font-weight:900;letter-spacing:-.5px}
.gcard .dev{position:absolute;top:10px;right:10px;z-index:1;display:flex;gap:4px}
.gcard .dev i{width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 2px #0008}
.gcard .nm{margin-top:8px;font-weight:700;font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gcard .poster{transition:transform .2s}
.gcard:hover .poster{transform:translateY(-4px)}

/* ---------- Backlog ---------- */
.bl-layout{display:block}
.bl-aside .card{margin-bottom:14px}
.bl-filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 14px}
.bl-filters::-webkit-scrollbar{display:none}
@media(min-width:1000px){
  .bl-layout{display:grid;grid-template-columns:330px 1fr;gap:24px;align-items:start}
  .bl-aside{position:sticky;top:84px}
  .bl-filters{flex-direction:column;overflow:visible;gap:4px}
  .bl-filters .chip{border-radius:14px;display:flex;justify-content:space-between;background:transparent;border-color:transparent}
  .bl-filters .chip.on{background:var(--ink)}
  .bl-filters .chip:not(.on):hover{background:var(--glass)}
}
.bhero{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.bhero .nums{display:flex;gap:22px;flex-wrap:wrap}
.bhero .nums b{font-size:34px;font-weight:900;display:block;line-height:1}
.bhero .nums span{font-size:12px;opacity:.75;font-weight:700}
.brow{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:14px;padding:10px;border-radius:18px;cursor:pointer}
.brow:hover{background:#ffffff08}
.brow .poster{width:52px;border-radius:10px;box-shadow:none}
.brow .ph,.rk .ph{font-size:0}
.brow .mid2{min-width:0}
.brow .mid2 b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .mid2 b .mc{height:22px;min-width:28px;font-size:12.5px;border-radius:7px;margin-right:8px;vertical-align:1px}
.brow .mid2 span{font-size:13px;color:var(--muted)}
.brow .cd{display:none;color:var(--muted);font-size:14px;font-weight:600;text-align:right}
.bhead{display:none}
@media(min-width:1000px){
  .brow{grid-template-columns:52px 1fr 150px 90px 90px 90px}
  .brow .cd{display:block}
  .bhead{display:grid;grid-template-columns:52px 1fr 150px 90px 90px 90px;gap:14px;padding:0 10px 8px;font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
  .bhead span:nth-child(n+4){text-align:right}
}
.ab-bar{height:8px;border-radius:8px;background:#ffffff14;overflow:hidden;margin:4px 0 16px}.ab-bar div{height:100%;background:linear-gradient(90deg,var(--lime),#14F0C8)}
.medals{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:18px 10px}
.medal{text-align:center;cursor:pointer}
.medal .ring{width:76px;height:76px;margin:0 auto 8px;border-radius:50%;display:grid;place-items:center;font-size:34px;
  background:radial-gradient(circle at 30% 25%,#ffffff40,transparent 55%),conic-gradient(from 200deg,var(--c),#ffffff30,var(--c));
  box-shadow:0 10px 30px -10px var(--c),inset 0 0 0 3px #0006;transition:transform .2s}
.medal .ring span{font-size:32px;line-height:1;width:60px;height:60px;border-radius:50%;background:#16191F;display:grid;place-items:center}
.medal:hover .ring{transform:translateY(-3px) rotate(-4deg)}
.medal b{display:block;font-size:12.5px;line-height:1.2}
.lrow{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid #ffffff10}
.lrow:first-of-type{border-top:0}
.lrow .le{width:42px;height:42px;border-radius:50%;background:#ffffff0d;display:grid;place-items:center;font-size:20px;filter:grayscale(.7);opacity:.8}
.lrow .lm b{display:block;font-size:14.5px}.lrow .lm span{font-size:12.5px;color:var(--muted)}
.lrow .pr{height:5px;border-radius:5px;background:#ffffff12;margin-top:6px;overflow:hidden}.lrow .pr div{height:100%;background:var(--lime)}

/* ================= Design G5: Graphit, Himmelblau, Türkis, Violett ================= */
html,body{background:radial-gradient(1200px 520px at 50% -120px,#242B37 0%,#101216 60%) fixed,#101216}

  transform:rotate(calc(var(--i)*11deg)) translateX(calc(var(--i)*30px));box-shadow:0 10px 24px #0008;transition:transform .35s;animation:fanIn .7s backwards;animation-delay:calc((var(--i) + 2)*70ms)}
.fanh:hover .fan .poster{transform:rotate(calc(var(--i)*15deg)) translateX(calc(var(--i)*40px)) translateY(-6px)}

.blurh>*{position:relative;z-index:1}
.focus{text-align:center;cursor:pointer;flex:none}.focus .poster{width:86px;border-radius:12px;box-shadow:0 0 0 2px var(--acc),0 12px 30px #0009;transform:rotate(4deg);transition:transform .3s}
.focus:hover .poster{transform:rotate(0) scale(1.05)}.focus span{display:block;margin-top:8px;font-size:11px;font-weight:800;color:var(--acc);letter-spacing:1px;text-transform:uppercase}
.tiers{display:grid;grid-template-columns:repeat(3,44px);gap:8px;flex:none}

.tiers i:nth-child(odd){transform:rotate(-6deg)}.tiers i:nth-child(even){transform:rotate(5deg)}
@keyframes pop{from{transform:scale(0) rotate(30deg);opacity:0}}

.tagst{position:absolute;right:-6px;top:-4px;background:var(--acc);color:var(--acc-ink);font-weight:900;font-size:13px;padding:6px 10px;border-radius:999px;transform:rotate(10deg);box-shadow:0 6px 16px #0007;animation:wob 2.6s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(-4deg) scale(1.06)}}
.avs{display:flex;flex:none}.avs span{margin-left:-14px;animation:fanIn .5s backwards;animation-delay:calc(var(--i)*70ms)}

@media(max-width:560px){.fan{width:150px;height:110px}.fan .poster{width:60px;margin-left:-30px;transform:rotate(calc(var(--i)*11deg)) translateX(calc(var(--i)*18px))}
  .stk{width:120px}.stk .poster{width:58px;left:calc(var(--i)*30px)}.tiers{grid-template-columns:repeat(3,34px)}.tiers i{width:34px;height:34px;font-size:15px}
  .avs .fav{width:38px!important;height:38px!important}.focus .poster{width:64px}}
.gpage-h{margin:6px 0 14px}.gpage-h .eyebrow{color:var(--acc);opacity:1}
/* Statistik-Kopf mit Mini-Balken */
.shead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding:22px;border-radius:var(--r);background:radial-gradient(90% 120% at 100% 100%,#33C3FF22,transparent 60%),var(--panel);border:1px solid #ffffff10;margin:4px 0 16px}

.lr{display:grid;grid-template-columns:auto 40px 1fr auto;gap:12px;align-items:center;padding:9px 6px;border-radius:14px;cursor:pointer;transition:background .2s,transform .2s}

.freegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}

/* ================= Verschlüsselung (Handy-App) ================= */
const enc = new TextEncoder();
const b64d = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
function b64e(u8){ let s=""; for (let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000)); return btoa(s); }
async function deriveKeys(pass, salt, it){
  const base = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveBits"]);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt,iterations:it}, base, 512));
  const ek = await crypto.subtle.importKey("raw", bits.slice(0,32), {name:"HMAC",hash:"SHA-256"}, false, ["sign"]);
  const mk = await crypto.subtle.importKey("raw", bits.slice(32), {name:"HMAC",hash:"SHA-256"}, false, ["sign","verify"]);
  return {ek, mk};
}
async function keystream(ek, nonce, len){
  const n = Math.ceil(len/32), out = new Uint8Array(n*32);
  for (let i=0;i<n;i+=1024){
    const ps = [];
    for (let j=i;j<Math.min(n,i+1024);j++){ const m=new Uint8Array(nonce.length+4); m.set(nonce); new DataView(m.buffer).setUint32(nonce.length,j); ps.push(crypto.subtle.sign("HMAC",ek,m)); }
    (await Promise.all(ps)).forEach((r,k)=>out.set(new Uint8Array(r),(i+k)*32));
  }
  return out.subarray(0,len);
}
const concat = (...a) => { const o=new Uint8Array(a.reduce((s,x)=>s+x.length,0)); let p=0; a.forEach(x=>{o.set(x,p);p+=x.length}); return o; };
async function decryptBlob(text, pass){
  const d = JSON.parse(text), salt=b64d(d.salt), nonce=b64d(d.nonce), ct=b64d(d.ct), tag=b64d(d.tag);
  const {ek, mk} = await deriveKeys(pass, salt, d.it||310000);
  if (!await crypto.subtle.verify("HMAC", mk, tag, concat(salt,nonce,ct))) throw new Error("Falsches Passwort");
  const ks = await keystream(ek, nonce, ct.length), pt = new Uint8Array(ct.length);
  for (let i=0;i<ct.length;i++) pt[i] = ct[i]^ks[i];
  let bytes = pt;
  if (d.gz) bytes = new Uint8Array(await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer());
  return JSON.parse(new TextDecoder().decode(bytes));
}
async function encryptObj(obj, pass){
  const it = 310000, salt = crypto.getRandomValues(new Uint8Array(16)), nonce = crypto.getRandomValues(new Uint8Array(12));
  const pt = enc.encode(JSON.stringify(obj)), {ek, mk} = await deriveKeys(pass, salt, it);
  const ks = await keystream(ek, nonce, pt.length), ct = new Uint8Array(pt.length);
  for (let i=0;i<pt.length;i++) ct[i] = pt[i]^ks[i];
  const tag = new Uint8Array(await crypto.subtle.sign("HMAC", mk, concat(salt,nonce,ct)));
  return JSON.stringify({v:1,it,gz:false,salt:b64e(salt),nonce:b64e(nonce),ct:b64e(ct),tag:b64e(tag)});
}

/* ================= Schätzung für Zeiträume =================
   Die Plattformen liefern nur Gesamtzeiten. Bis der Verlauf einen Zeitraum vollständig
   abdeckt, schätzen wir den Anteil je Spiel:
   - Steam-Spiele mit Erfolgen: Anteil der Erfolge, die im Jahr freigeschaltet wurden
   - sonst: jüngere Spielzeit zählt stärker (Halbwertszeit 1 Jahr) zwischen erstem und letztem Spieltag
   - Steam "letzte 2 Wochen" für Woche und Monat
   - eigene Korrekturen (pro Spiel) haben immer Vorrang
   Gemessene Zuwächse seit Start der Aufzeichnung kommen jeweils oben drauf. */
const HALF = 365*864e5, LN2 = Math.log(2);
function periodStartDate(p){ const n = new Date(); if (p==="year") return new Date(n.getFullYear(),0,1); if (p==="month") return new Date(n.getFullYear(),n.getMonth(),1); if (p==="week") return new Date(Date.now()-7*864e5); return null; }
function estimatePeriod(p, measured){
  const ps = periodStartDate(p), now = new Date(), year = now.getFullYear(), out = {};
  const ach = (S.data.steam||{}).ach || {};
  for (const r of S.data.games){
    const delta = measured ? (measured[r.id]||0) : 0, base = Math.max(0, (r.minutes||0) - delta), last = pdate(r.last_played);
    let est = 0;
    if (base && last && last >= ps){
      const end = last > now ? now : last;
      let first = pdate(r.first_played);
      const ry = Number(r.release_year);
      if (!first && ry >= 1970 && ry <= year) first = new Date(ry,0,1);
      let share = null;
      const a = r.steam_appid && ach[r.steam_appid];
      if (p === "year" && a && a.d >= 3 && (a.y||{})[year]) share = (a.y[year]||0) / a.d;
      let tw = false;
      if (share === null && (p === "week" || p === "month") && r.two_weeks){ share = Math.min(r.minutes||0, r.two_weeks * Math.min(1, (now-ps)/(14*864e5))) / base; tw = true; }
      if (share === null){
        if (first && first >= ps) share = 1;
        else {
          const lam = LN2 / HALF, win = 1 - Math.exp(-lam * (end - ps));
          const norm = first ? 1 - Math.exp(-lam * Math.max(end - first, end - ps)) : 1;
          share = norm > 0 ? win / norm : 1;
        }
      }
      est = Math.round(base * Math.max(0, Math.min(tw ? 99 : 1, share)));
      // Steam "letzte 2 Wochen" enthält die gemessene Zeit schon
      if (tw){ if (Math.max(est, delta) > 0) out[r.id] = Math.max(est, delta); continue; }
    }
    if (est + delta > 0) out[r.id] = est + delta;
  }
  // Aufgezeichnete PC-Sessions sind exakt: mindestens so viel zählen
  const sess = {};
  for (const [k, st, sec] of (S.data.sessions||[])) if (st*1000 >= +ps) sess[k] = (sess[k]||0) + sec/60;
  if (Object.keys(sess).length){
    const pcBy = {};
    for (const r of S.data.games) if (r.device === "PC"){ const k = norm(r.title); (pcBy[k] = pcBy[k] || []).push(r); }
    for (const [k, mins] of Object.entries(sess)){
      const recs = pcBy[k]; if (!recs) continue;
      const cur = recs.reduce((s,r)=>s+(out[r.id]||0),0);
      if (mins > cur){ const top = [...recs].sort((a,b)=>(b.minutes||0)-(a.minutes||0))[0]; out[top.id] = (out[top.id]||0) + Math.round(mins - cur); }
    }
  }
  // Eigene Korrekturen (pro Spiel) – nur fürs Jahr
  const ov = p === "year" ? ((S.data.year_overrides||{})[String(year)] || {}) : {};
  if (Object.keys(ov).length){
    const byKey = {};
    for (const r of S.data.games){ const k = norm(r.title); (byKey[k] = byKey[k] || []).push(r); }
    for (const [k, mins] of Object.entries(ov)){
      const recs = byKey[k]; if (!recs) continue;
      const sum = recs.reduce((s,r)=>s+(out[r.id]||0),0);
      if (sum > 0) for (const r of recs) out[r.id] = Math.round(mins * (out[r.id]||0) / sum);
      else { const top = [...recs].sort((a,b)=>(b.minutes||0)-(a.minutes||0))[0]; for (const r of recs) delete out[r.id]; out[top.id] = mins; }
    }
  }
  return out;
}
function applyEstimate(){
  const p = S.data.period || {};
  if (p.period && p.period !== "all" && !p.complete){ S.data.period_minutes = estimatePeriod(p.period, S.data.period_minutes); p.estimated = true; }
}

function autoStatus(g){
  const c = (g.completion||"").toLowerCase();
  if (c){
    if (/not|nicht|ungespielt/.test(c)) return "ungespielt";
    if (/plan|geplant|wunsch/.test(c)) return "als_naechstes";
    if (/hold|pausiert|pause/.test(c)) return "pausiert";
    if (/abandon|abgebrochen/.test(c)) return "abgebrochen";
    if (/complet|abgeschlossen|100|komplett/.test(c)) return "komplett";
    if (/beaten|beendet|durch|geschafft/.test(c)) return "durchgespielt";
  }
  const ft = g.features.map(x=>x.toLowerCase());
  const mp = ft.some(x=>/multi|online|pvp|mmo/.test(x)), sp = ft.some(x=>/single|einzel/.test(x));
  if ((mp && !sp) || g.genres.some(x=>/battle royale|mmo/i.test(x))) return "endlos";
  if (c && /play|spiel/.test(c)) return "angefangen";
  return g.pcMinutes > 0 ? "angefangen" : "ungespielt";
}
function coverOrder(urls, extra){
  // Playnite-Cover (nur am PC erreichbar) > Steam > IGDB > Plattform-Bild
  const pn=[], st=[], nat=[];
  for (const u of urls){ if (u.startsWith("/api/img")) { if (LOCAL) pn.push(u); } else if (u.includes("steamstatic")) st.push(u); else nat.push(u); }
  return [...new Set([...pn, ...st, ...(extra||[]), ...nat])];
}
const DEFAULT_BL_STORES = ["Steam","Ubisoft","EA","GOG","Epic Games"];
const backlogStores = () => ((S.data && S.data.prefs && S.data.prefs.backlog_stores) || DEFAULT_BL_STORES);
function buildGroups(){
  const d = S.data, pm = d.period_minutes, m = new Map();
  for (const r of d.games){
    const k = norm(r.title) || r.id;
    let g = m.get(k);
    if (!g){ g = {key:k, title:r.title, recs:[], minutes:0, pmin:0, pcMinutes:0, plats:{}, devs:{}, pc:false, genres:new Set(), features:new Set(),
      devsList:new Set(), year:null, added:null, last:null, installed:false, hidden:true, completion:null, first:null}; m.set(k,g); }
    g.recs.push(r);
    const mins = r.minutes||0, pmins = pm ? (pm[r.id]||0) : mins;
    g.minutes += mins; g.pmin += pmins;
    const pl = platLabel(r);
    g.plats[pl] = (g.plats[pl]||0) + pmins;
    g.devs[r.device] = (g.devs[r.device]||0) + pmins;
    if (r.device === "PC"){
      g.pc = true; g.pcMinutes += mins;
      g.pcStores = g.pcStores || new Set(); g.pcStores.add(r.store);
      if (!r.family && backlogStores().includes(r.store)) g.owned = true;
      if (!r.hidden) g.hidden = false;
      (r.genres||[]).forEach(x=>g.genres.add(x)); (r.features||[]).forEach(x=>g.features.add(x));
      (r.developers||[]).forEach(x=>g.devsList.add(x));
      const ry = Number(r.release_year);
      if (ry >= 1970 && ry <= new Date().getFullYear()+1 && (!g.year || ry < g.year)) g.year = ry;
      const a = pdate(r.added); if (a && (!g.added || a < g.added)) g.added = a;
      if (r.installed) g.installed = true;
      if (r.completion && !g.completion) g.completion = r.completion;
    }
    if (r.device !== "PC") g.consoleMin = (g.consoleMin||0) + mins;
    const l = pdate(r.last_played); if (l && (!g.last || l > g.last)) g.last = l;
    const f = pdate(r.first_played); if (f && (!g.first || f < g.first)) g.first = f;
  }
  for (const g of m.values()){
    const recs = [...g.recs].sort((a,b)=>(b.minutes||0)-(a.minutes||0));
    const pcRec = recs.find(r=>r.device==="PC"); g.title = cleanTitle(pcRec ? pcRec.title : recs[0].title) || recs[0].title;
    g.hltb = (d.hltb||{})[g.key] || null;
    // IGDB hat bei manchen Spielen unsinnige Werte (Community-Angaben): über 300 Std ignorieren, außer selbst eingetragen
    if (g.hltb && !g.hltb.manual){ const cap = v => v && v > 300*60 ? null : v; g.hltb = {...g.hltb, main: cap(g.hltb.main), plus: cap(g.hltb.plus), comp: g.hltb.comp && g.hltb.comp > 600*60 ? null : g.hltb.comp}; }
    const hImg = g.hltb && g.hltb.image ? [g.hltb.image] : [];
    g.covers = coverOrder(recs.flatMap(r=>r.covers||[]), hImg);
    g.banners = coverOrder(recs.flatMap(r=>r.banners||[]), hImg).concat(g.covers.filter(c=>!c.includes("library_600x900")));
    g.genres = [...g.genres]; g.features = [...g.features]; g.devsList = [...g.devsList];
    g.meta = d.meta[g.key] || {};
    g.tier = g.minutes >= 300 ? (g.meta.tier || null) : null; // Tier-Liste erst ab 5 Std
    const sr = recs.find(r=>r.steam_appid); g.appid = sr ? sr.steam_appid : null;
    const sx = d.steam || {};
    g.ach = g.appid && sx.ach ? sx.ach[g.appid] || null : null;
    g.price = g.appid && sx.prices ? sx.prices[g.appid] || null : null;
    const scr = g.appid && sx.scores ? sx.scores[g.appid] || null : null;
    const pnCritic = Math.max(0, ...recs.map(r=>Number(r.critic)||0));
    g.critic = scr && scr.mc ? scr.mc : pnCritic || (g.hltb && g.hltb.critic) || null;
    g.criticSrc = scr && scr.mc ? "Metacritic" : pnCritic ? "Fachpresse" : g.critic ? "IGDB" : null;
    g.rev = scr && scr.rt ? {pct: scr.rp, total: scr.rt} : null;
    g.auto = autoStatus(g);
    g.status = g.meta.status || g.auto;
    g.isAuto = !g.meta.status;
    g.remaining = remaining(g);
  }
  S.allGroups = [...m.values()];
  for (const g of S.allGroups) g.hide = !!g.meta.hide;
  S.groups = S.allGroups.filter(g=>!g.hide);
  for (const g of S.allGroups) for (const r of g.recs){ const k = norm(r.title); if (k && !m.has(k)) m.set(k, g); }
  S.gmap = m;
}
function remaining(g){
  if (!g.hltb || !g.hltb.main || !g.pc || SMAP[g.status].g !== "open" || g.status === "endlos") return null;
  if (g.genres.some(x=>/battle royale|mmo|massively/i.test(x))) return null;
  const main = g.hltb.main;
  return g.status==="angefangen" || g.status==="pausiert" ? Math.max(main - g.pcMinutes, main*0.15) : main;
}

  root.querySelectorAll("[data-count]").forEach(el=>{
    const to = Number(el.dataset.count), dec = Number(el.dataset.dec||0), t0 = performance.now(), dur = 1400;
    const step = t => { const p = Math.min(1,(t-t0)/dur), e = 1-Math.pow(1-p,4); el.textContent = (el.dataset.pre||"") + num(to*e, dec); if (p<1) requestAnimationFrame(step); };

  root.querySelectorAll("[data-w]").forEach(el=>requestAnimationFrame(()=>{ el.style.width = el.dataset.w; }));

// Alle Sessions: PC (exakt) + Konsole (aus Abgleich-Differenzen, teils ungefähr)
// Format: [key, start, sekunden, gerät, ungefähr]
function allSessions(){
  const pc = (S.data.sessions||[]).map(x=>[x[0], x[1], x[2], "PC", 0]);
  const co = (S.data.csessions||[]).map(x=>[x[0], x[1], x[2], x[3], x[4]]);
  return pc.concat(co).sort((a,b)=>a[1]-b[1]);
}
function sessionStats(fromTs){
  const ss = allSessions().filter(s=>!fromTs || s[1] >= fromTs);
  const perDay = {}, perDayC = {}, approxDay = {}, hours = new Array(24).fill(0), wd = new Array(7).fill(0), perGame = {};
  let longest = null, total = 0;
  for (const [k, s, sec, dev, ap] of ss){
    const d = new Date(s*1000), min = sec/60, dk = dayKey(d);
    total += min;
    perDay[dk] = (perDay[dk]||0) + min;
    if (dev !== "PC") perDayC[dk] = (perDayC[dk]||0) + min;
    if (ap) approxDay[dk] = true;
    wd[(d.getDay()+6)%7] += min;
    perGame[k] = (perGame[k]||0) + min;
    if (ap) continue; // Uhrzeit unbekannt: nicht in Uhrzeit-Statistik und Rekorde
    let t = s; const end = s + sec;
    while (t < end){ const x = new Date(t*1000), h = x.getHours(); x.setMinutes(60,0,0); const nt = Math.min(end, x.getTime()/1000); hours[h] += (nt-t)/60; t = nt; }
    if (!longest || sec > longest[2]) longest = [k, s, sec];
  }
  const days = Object.keys(perDay).sort();
  let best = 0, run = 0, prev = null;
  for (const dk of days){ const d = new Date(dk+"T12:00"); run = prev && (d-prev)/864e5 < 1.5 ? run+1 : 1; best = Math.max(best, run); prev = d; }
  const set = new Set(days); let curStreak = 0; const t = new Date(); t.setHours(12,0,0,0);
  if (!set.has(dayKey(t))) t.setDate(t.getDate()-1);
  while (set.has(dayKey(t))){ curStreak++; t.setDate(t.getDate()-1); }
  const win = {Nachteule:[22,23,0,1,2,3,4], Frühaufsteher:[5,6,7,8,9,10], Mittagszocker:[11,12,13,14,15,16], "Feierabend-Gamer":[17,18,19,20,21]};
  const wsum = Object.fromEntries(Object.entries(win).map(([k,hs])=>[k, hs.reduce((s,h)=>s+hours[h],0)]));
  const type = hours.some(v=>v>0) ? Object.entries(wsum).sort((a,b)=>b[1]-a[1])[0][0] : null;
  const since = ss.length ? ss[0][1] : null;
  const htot = hours.reduce((a,b)=>a+b,0);
  return {ss, perDay, perDayC, approxDay, hours, wd, perGame, longest, total, days, best, curStreak, type, night: htot ? wsum.Nachteule/htot : 0,
    weekend: total ? (wd[5]+wd[6])/total : 0, since, avg: ss.length ? total/ss.length : 0};
}
function titleOf(k){ const g = S.gmap.get(k); return g ? g.title : k; }
function weeklyPace(){
  const ss = allSessions(); if (!ss.length) return null;
  const now = Date.now()/1000, first = ss[0][1];
  if (now - first < 7*86400) return null;
  const from = Math.max(first, now - 56*86400);
  const min = ss.filter(s=>s[1]>=from).reduce((a,s)=>a+s[2]/60,0);
  return min / ((now-from)/(7*86400));
}

function facts(played,total,plats){
  const f = [], scope = scopeLabel(), sinceRec = st => st.since ? `seit ${fdate(new Date(st.since*1000))}` : scope;

    () => barRows(plats.map(([k,v])=>[k,v,pcolor(k)]), total), null, "🎮");

        <p class="help">Nach Uhrzeit, aus ${st.ss.filter(x=>!x[4]).length} Sessions (PC live, Konsole sofern die Uhrzeit bekannt ist).</p>`, sinceRec(st), "🌙");
    if (st.longest) add("Längste Session", hrs(st.longest[2]/60), `${titleOf(st.longest[0])} am ${fdate(new Date(st.longest[1]*1000))}`,
      () => st.ss.filter(x=>!x[4]).sort((a,b)=>b[2]-a[2]).slice(0,8).map(([k,s0,sec,dev])=>{ const g = S.gmap.get(k);
        return g ? gRow(g, hrs(sec/60), `${fdate(new Date(s0*1000))} · ${dev}`) : ""; }).join(""), sinceRec(st), "⏱️");
    if (st.best > 1) add("Längste Serie", `${st.best} Tage`, "am Stück gezockt",

  }

    () => c100.map(g=>gRow(g, hrs(val(g)))).join("") || `<p class="help">Noch keins.</p>`, null, "💯");
  const tempo = tempoStats();
  if (tempo) add("Tempo", `${num(Math.abs(tempo.pct))} % ${tempo.pct<0?"schneller":"langsamer"}`, `als der Durchschnitt laut IGDB (${tempo.n} Spiele)`,
    () => S.groups.filter(g=>g.pc && SMAP[g.status].g==="done" && g.hltb && g.hltb.main && g.pcMinutes > 30).map(g=>[g, g.pcMinutes/g.hltb.main]).sort((a,b)=>a[1]-b[1])
      .map(([g,r])=>gRow(g, `${r<1?"−":"+"}${num(Math.abs(r-1)*100)} %`, `du ${hrs(g.pcMinutes)} · Schnitt ${hrs(g.hltb.main)}`)).join(""), "alle durchgespielten", "⚡");

  if (S.period==="all"){

      add("Bestbewertet gespielt", best[0].title, `${best[0].critic} Punkte bei der Fachpresse`, () => best.slice(0,10).map(g=>gRow(g, mcBadge(g.critic), hrs(val(g)))).join(""), null, "⭐");
      const odd = rated.filter(g=>g.critic<70 && val(g)>=600).sort((a,b)=>val(b)-val(a));
      if (odd.length) add("Gegen den Strom", odd[0].title, `nur ${odd[0].critic} Punkte – trotzdem ${hrs(val(odd[0]))} gespielt`, () => odd.slice(0,10).map(g=>gRow(g, mcBadge(g.critic), hrs(val(g)))).join(""), null, "🐟");
    }

  if (A[py] && A[cy]) pairs.push([cy, py, A[cy], A[py], (n - new Date(n.getFullYear(),0,1))/(365*864e5)]);

}

  const wmx = Math.max(...st.wd, 1);

const TIER_MIN = 300; // erst ab 5 Stunden kann man ein Spiel einordnen
function renderTier(){
  const q = norm(S.lib.tq||"");
  const played = S.groups.filter(g=>g.minutes >= TIER_MIN).sort((a,b)=>b.minutes-a.minutes);
  const pool = played.filter(g=>!g.tier && (!q || g.key.includes(q)));
  const item = g => `<div class="titem" data-k="${esc(g.key)}" title="${esc(g.title)}"><div class="poster">${img(g.covers,g.title)}</div></div>`;
  $("#view").innerHTML = `${tierHead(S.groups.filter(g=>g.tier).length)}${libSeg()}
    <p class="help" style="margin-top:-6px">${matchMedia("(pointer:fine)").matches?"Cover in eine Reihe ziehen. Antippen öffnet das Spiel.":"Cover antippen und Rang wählen."}</p>
    ${TIERS.map(([t,c])=>`<div class="tierrow"><div class="tl" style="background:${c}">${t}</div><div class="tz" data-tier="${t}">${played.filter(g=>g.tier===t).map(item).join("")}</div></div>`).join("")}
    <div class="secttl" style="margin-top:20px">Noch nicht eingeordnet (${pool.length})</div>
    <div class="toolbar"><input id="tq" type="search" placeholder="Spiel suchen …" value="${esc(S.lib.tq||"")}"></div>
    <div class="tpool" data-tier="">${pool.slice(0, S.lib.tlimit||80).map(item).join("") || `<span class="help">Alles eingeordnet!</span>`}</div>
    ${pool.length > (S.lib.tlimit||80) ? `<button class="btn ghost more" onclick="S.lib.tlimit=(S.lib.tlimit||80)+120;renderTier()">Mehr anzeigen</button>`:""}`;
  $("#tq").oninput = e => { S.lib.tq = e.target.value; const pos = e.target.selectionStart; renderTier(); const el=$("#tq"); el.focus(); el.setSelectionRange(pos,pos); };
  document.querySelectorAll(".titem").forEach(el => {
    el.ondragstart = e => e.preventDefault();
    el.onpointerdown = e => {
      if (e.button !== 0) return;
      const sx = e.clientX, sy = e.clientY, mouse = e.pointerType === "mouse";
      let ghost = null, zone = null, moved = false;
      const move = ev => {
        if (Math.hypot(ev.clientX-sx, ev.clientY-sy) > 10) moved = true;
        if (!ghost){
          if (!mouse || Math.hypot(ev.clientX-sx, ev.clientY-sy) < 6) return;
          ghost = el.cloneNode(true); el.style.opacity = ".3";
          ghost.style.cssText = `position:fixed;z-index:200;pointer-events:none;width:${el.offsetWidth}px;transform:rotate(-4deg) scale(1.08);filter:drop-shadow(0 12px 24px #000a)`;
          document.body.appendChild(ghost);
        }
        ghost.style.left = (ev.clientX - el.offsetWidth/2) + "px"; ghost.style.top = (ev.clientY - el.offsetHeight/2) + "px";
        const z = document.elementFromPoint(ev.clientX, ev.clientY)?.closest(".tz,.tpool");
        if (z !== zone){ zone && zone.classList.remove("over"); zone = z; zone && zone.classList.add("over"); }
      };
      const up = ev => {
        removeEventListener("pointermove", move); removeEventListener("pointerup", up); removeEventListener("pointercancel", up);
        // Beim Scrollen am Handy kommt "pointercancel" – das ist kein Antippen
        if (!ghost){ if (ev.type === "pointerup" && !moved) tierPick(el.dataset.k); return; }
        ghost.remove(); el.style.opacity = ""; zone && zone.classList.remove("over");
        if (zone && (zone.dataset.tier || null) !== (S.gmap.get(el.dataset.k).tier || null)) setTier(el.dataset.k, zone.dataset.tier || null, false);
      };
      addEventListener("pointermove", move); addEventListener("pointerup", up); addEventListener("pointercancel", up);
    };
  });
}

/* ================= Reihen (Franchises) ================= */
const STOP = new Set(["the","of","a","an","and","s","der","die","das","edition","game","games","tom"]);
function franchiseKey(g){
  const t = g.key.split(" ").filter(w => w.length > 1 && !STOP.has(w));
  if (!t.length) return null;
  if (t.length === 1 || /^(\d+|[ivx]+)$/.test(t[1])) return t[0].length >= 4 ? t[0] : null;
  return t[0] + " " + t[1];
}
function franchises(list, val){
  const m = new Map();
  for (const g of list){ const k = franchiseKey(g); if (!k) continue; const e = m.get(k) || {k, games:[], minutes:0}; e.games.push(g); e.minutes += val(g); m.set(k, e); }
  const out = [...m.values()].filter(f => f.games.length >= 2);
  for (const f of out){
    // Anzeigename: gemeinsamer Wort-Anfang der Originaltitel
    const words = f.games.map(g => g.title.replace(/[™®©]/g,"").split(/\s+/));
    let n = 0; while (words.every(w => w[n] && w[n].toLowerCase().replace(/[:\-–]$/,"") === words[0][n].toLowerCase().replace(/[:\-–]$/,""))) n++;
    f.name = n ? words[0].slice(0, n).join(" ").replace(/[:\-–]$/,"") : f.games[0].title;
  }
  return out.sort((a,b)=>b.minutes-a.minutes);
}

function badgeCtx(){
  const st = sessionStats(0), y = String(new Date().getFullYear());
  const played = S.groups.filter(g=>g.minutes>0);
  const total = played.reduce((s,g)=>s+g.minutes,0);
  const maxG = played.reduce((m,g)=>Math.max(m,g.minutes),0);
  let early = 0; for (const [,s] of st.ss){ const h = new Date(s*1000).getHours(); if (h>=5 && h<9) early++; }
  const gen = {}; for (const g of played) for (const x of g.genres) gen[x]=(gen[x]||0)+g.pcMinutes;
  const ach = Object.values((S.data.steam||{}).ach||{});
  const rare = ach.reduce((m,a)=>a.r && a.r[1]!=null ? Math.min(m,a.r[1]) : m, 101);
  const devs = new Set(played.flatMap(g=>Object.keys(g.devs)));
  const dev = {}; for (const g of played) for (const [k,v] of Object.entries(g.devs)) dev[k] = (dev[k]||0) + v;
  const genAll = {}; for (const g of played) for (const x of g.genres) genAll[x.toLowerCase()] = (genAll[x.toLowerCase()]||0) + g.pcMinutes;
  const gsum = k => Object.entries(genAll).filter(([n])=>n.includes(k)).reduce((s,[,v])=>s+v,0);
  const pcTot = Object.values(genAll).length ? Math.max(...Object.values(genAll)) : 0;
  const decades = new Set(played.filter(g=>g.year).map(g=>Math.floor(g.year/10)));
  let midnight = 0; for (const [, s, sec] of st.ss){ const a = new Date(s*1000), b = new Date((s+sec)*1000); if (a.getDate() !== b.getDate()) midnight++; }
  const fr = franchises(played, g=>g.minutes);
  const multi = played.filter(g=>Object.values(g.devs).filter(v=>v>=600).length>=2).length;
  const cnt = st2 => S.groups.filter(g=>g.status===st2 && g.pc).length;
  const extra = {dev, shooter: gsum("shoot"), rpg: gsum("role") + gsum("rpg"), indie: gsum("indie"), strategy: gsum("strateg"),
    sim: gsum("simul"), decades: decades.size, midnight, frMax: fr.length ? fr[0].games.length : 0, multi,
    old: played.filter(g=>g.year && g.year < 2000).length, c100x5: played.filter(g=>g.minutes>=6000).length,
    doneAll: S.groups.filter(g=>g.pc && DONE.has(g.status)).length, endlos: cnt("endlos"), next: cnt("als_naechstes"),
    notes: S.groups.filter(g=>g.meta.note).length, sessions: st.ss.length, ten: played.filter(g=>g.minutes>=600).length,
    genreTop: pcTot, pcAll: played.reduce((s2,g)=>s2+g.pcMinutes,0)};
  return {...extra, st, total, maxG, early, doneYear: doneInYear(y).length, comp: S.groups.filter(g=>g.pc&&g.status==="komplett").length,
    devCount: devs.size, groups: S.groups.length, retro: played.filter(g=>g.year && g.year<2005).reduce((m,g)=>Math.max(m,g.minutes),0),
    genres5: Object.values(gen).filter(v=>v>=300).length, rated: S.groups.filter(g=>g.meta.rating).length,
    tiered: S.groups.filter(g=>g.tier).length, gourmet: played.filter(g=>(g.critic||0)>=90).length,
    trash: played.some(g=>g.critic && g.critic<60 && g.minutes>=300) ? 1 : 0,
    gems: played.filter(g=>g.rev && g.rev.pct>=95 && g.rev.total>=500).length, achTotal: ach.reduce((s,a)=>s+a.d,0), rare, topShare: total ? maxG/total : 0,
    unplayed: backlogStats().unplayed};
}

async function ensurePeriod(p){
  S.pcache = S.pcache || {};
  if (S.pcache[p]) return S.pcache[p];
  let pm = {}, info = {};
  if (CLOUD){ const x = ((S.snap||{}).periods||{})[p]; if (x){ pm = {...(x.pm||{})}; info = {...(x.info||{})}; } }
  else { try { const d = await (await fetch("/api/data?period="+p)).json(); pm = d.period_minutes || {}; info = d.period || {}; } catch(e){} }
  if (!info.complete){ pm = estimatePeriod(p, pm); info.estimated = true; }
  S.pcache[p] = {pm, info};
  if (p === "year"){ S.yearPM = pm; S.yearInfo = info; }
  return S.pcache[p];
}
const ensureYear = () => ensurePeriod("year");

function kw(d){ const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const day = t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-day); const y0 = new Date(Date.UTC(t.getUTCFullYear(),0,1)); return Math.ceil(((t-y0)/864e5+1)/7); }
function wrapModes(){
  const y = new Date().getFullYear();
  const n = new Date(), curM = `${y}-${String(n.getMonth()+1).padStart(2,"0")}`;
  const keys = Object.keys(S.data.wrapped_archive||{});
  const months = keys.filter(k=>/^\d{4}-\d{2}$/.test(k) && k < curM).sort().reverse().slice(0,3);
  const years = keys.filter(k=>/^\d{4}$/.test(k) && Number(k) < y).sort().reverse();
  return [["year",String(y)],["month",MON()],["week","Diese Woche"],["all","Alle Zeiten"],
    ...months.map(a=>["arch:"+a, monLabel(a)]), ...years.map(a=>["arch:"+a, a])];
}
const monLabel = k => new Date(Number(k.slice(0,4)), Number(k.slice(5,7))-1, 1).toLocaleDateString("de-DE",{month:"long", year:"numeric"});
// Laufendes Jahr und laufenden Monat fürs Archiv sichern (höchstens einmal pro Tag). Ab dem 1.1. bleibt es eingefroren.
async function saveYearArchive(){
  if (CLOUD) return; // das Archiv führt der PC
  const n = new Date(), y = String(n.getFullYear()), m = `${y}-${String(n.getMonth()+1).padStart(2,"0")}`, today = n.toISOString().slice(0,10);
  const arch = S.data.wrapped_archive || {};
  if (arch[y] && String(arch[y].saved||"").slice(0,10) === today && arch[m] && String(arch[m].saved||"").slice(0,10) === today) return;
  const all = {...arch};
  for (const [p, key] of [["year", y], ["month", m]]){
    const {pm, info} = await ensurePeriod(p), games = {};
    for (const g of S.groups){ const devs = {}; let mm = 0;
      for (const r of g.recs){ const v = pm[r.id]||0; if (v){ mm += v; devs[r.device] = (devs[r.device]||0) + v; } }
      if (mm > 0) games[g.key] = [mm, devs]; }
    if (Object.keys(games).length) all[key] = {saved: n.toISOString(), estimated: !!info.estimated, games};
  }
  // nur die letzten 6 Monate behalten, Jahre immer
  const ms = Object.keys(all).filter(k=>/^\d{4}-\d{2}$/.test(k)).sort().reverse();
  ms.slice(6).forEach(k=>delete all[k]);
  if (JSON.stringify(all) === JSON.stringify(arch)) return;
  try { await saveKv("wrapped", all); S.data.wrapped_archive = all; } catch(e){}
}

function wKeys(e){ if (e.key==="ArrowRight"||e.key===" ") wGo(1); else if (e.key==="ArrowLeft") wGo(-1); else if (e.key==="Escape") closeWrapped(); }

function wShow(){

  W.t0 = performance.now(); W.elapsed = 0; cancelAnimationFrame(W.raf);

/* Handy: Änderungen verschlüsselt nach GitHub schicken, der PC übernimmt sie */
let flushing = false;
async function flushEdits(){
  if (!CLOUD || flushing || !S.snap || !S.snap.gh) return;
  const q = edits().filter(e=>!e.sent); if (!q.length) return;
  flushing = true;
  try {
    const {repo, token, branch} = S.snap.gh, ts = Date.now();
    const body = await encryptObj({edits:q}, pass());
    const name = `edits/${ts}-${Math.random().toString(36).slice(2,8)}.enc`;
    const r = await fetch(`https://api.github.com/repos/${repo}/contents/${name}`, {method:"PUT",
      headers:{"Authorization":"Bearer "+token,"Accept":"application/vnd.github+json","Content-Type":"application/json"},
      body: JSON.stringify({message:"Änderung vom Handy", content:btoa(unescape(encodeURIComponent(body))), branch})});
    if (r.ok){ const sent = new Set(q.map(e=>e.ts)); store.set("gr_edits", edits().map(e=>sent.has(e.ts)?{...e,sent:true}:e)); }
  } catch(e){ /* offline: später nochmal */ }
  finally { flushing = false; header(); }
}
window.addEventListener("online", flushEdits);
window.sendNow = async () => {
  await flushEdits();
  const left = edits().filter(e=>!e.sent).length;
  toast(left ? "Kein Netz – wird später gesendet" : "Gesendet – der PC übernimmt sie in ~2 Minuten");

const PK = {pool:"open", genre:"", inst:false, len:"", mood:"", pick:null};
const MOODS = {
  chill: g => (g.remaining==null || g.remaining < 900) && !g.genres.some(x=>/shooter|horror|soulslike|competitive/i.test(x)),
  story: g => g.genres.some(x=>/rpg|rollenspiel|adventure|abenteuer|story|visual novel/i.test(x)),
  friends: g => g.features.some(x=>/multi|co-?op|koop/i.test(x)),
  top: g => (g.critic||0) >= 85 || (g.rev && g.rev.total >= 500 && g.rev.pct >= 92),
};
window.openPicker = () => { PK.pick = null; renderPicker(); $("#picker").showModal(); };
function pickerPool(){
  return blGames().filter(g => (PK.pool==="open" ? SMAP[g.status].g==="open" : g.status===PK.pool)
    && (!PK.genre || g.genres.includes(PK.genre)) && (!PK.inst || g.installed)
    && (!PK.mood || MOODS[PK.mood](g)) && (!PK.len || (g.remaining!=null && (PK.len==="s" ? g.remaining<600 : PK.len==="m" ? g.remaining>=600&&g.remaining<1800 : g.remaining>=1800))));
}
function renderPicker(){
  const genres = [...new Set(blGames().filter(g=>SMAP[g.status].g==="open").flatMap(g=>g.genres))].sort((a,b)=>a.localeCompare(b,"de"));
  const pool = pickerPool(), g = PK.pick;
  const chip = (k,l,v,f) => `<button class="chip ${PK[f]===k?"on":""}" onclick="PK.${f}='${k}';PK.pick=null;renderPicker()">${l}</button>`;
  $("#pickerBody").innerHTML = `<button class="ibtn dclose" onclick="$('#picker').close()">✕</button><div class="pk">
    <div class="eyebrow">Was spiele ich als Nächstes?</div>
    <div class="slot" id="slot"><div class="poster">${g?img(g.covers,g.title):ph("?")}</div></div>
    <h2 id="pkTitle">${g?esc(g.title):"Lass den Würfel entscheiden"}</h2>
    <div class="why">${g?pickWhy(g):`${pool.length} Spiele im Topf`}</div>
    <div class="opts">${[["open","Alles offen"],["als_naechstes","🎯 Als Nächstes"],["angefangen","▶️ Angefangen"],["ungespielt","📦 Nie gestartet"],["pausiert","⏸️ Pausiert"]].map(([k,l])=>chip(k,l,0,"pool")).join("")}</div>
    <div class="opts">${[["","Jede Stimmung"],["chill","😌 Entspannt"],["story","📖 Story-Abend"],["friends","👥 Mit Freunden"],["top","⭐ Top bewertet"]].map(([k,l])=>chip(k,l,0,"mood")).join("")}</div>
    <div class="opts">${[["","Jede Länge"],["s","⚡ Kurz (< 10 Std)"],["m","Mittel (10–30)"],["l","Lang (30+)"]].map(([k,l])=>chip(k,l,0,"len")).join("")}</div>
    <div class="opts"><select onchange="PK.genre=this.value;PK.pick=null;renderPicker()"><option value="">Alle Genres</option>${genres.map(x=>`<option ${PK.genre===x?"selected":""}>${esc(x)}</option>`).join("")}</select>
      <label class="check" style="margin:0"><input type="checkbox" ${PK.inst?"checked":""} onchange="PK.inst=this.checked;PK.pick=null;renderPicker()"> nur installierte</label></div>
    <div class="acts"><button class="btn limeb" id="roll" ${pool.length?"":"disabled"}>🎲 ${g?"Nochmal":"Würfeln"}</button>
      ${g && g.status!=="als_naechstes" ? `<button class="btn ghost" onclick="setStatus('${esc(g.key)}','als_naechstes').then(()=>$('#picker').close())">🎯 Merken</button>`:""}
      ${g ? `<button class="btn ghost" onclick="$('#picker').close();openGame('${esc(g.key)}')">Details</button>`:""}</div></div>`;
  $("#roll").onclick = roll;
}
function pickWhy(g){
  const bits = [];
  if (g.added) bits.push(`liegt seit ${fdate(g.added)} im Regal`);
  bits.push(g.pcMinutes ? `${hrs(g.pcMinutes)} gespielt` : "noch nie gestartet");
  if (g.remaining) bits.push(`noch ca. ${hrs(g.remaining)}`);
  return esc(bits.join(" · "));
}
function roll(){
  const pool = pickerPool(); if (!pool.length) return;
  const final = pool[Math.floor(Math.random()*pool.length)];
  $("#roll").disabled = true;
  let i = 0, delay = 40;
  const tick = () => {
    const g = i < 16 ? pool[Math.floor(Math.random()*pool.length)] : final;
    $("#slot").innerHTML = `<div class="poster">${img(g.covers,g.title)}</div>`;
    $("#pkTitle").textContent = g.title;
    if (i < 16){ i++; delay *= 1.12; setTimeout(tick, delay); }
    else { PK.pick = final; renderPicker(); $("#slot").classList.add("pop"); }
  };
  tick();
}

async function post(url, body){
  const r = await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const j = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(j.error || ("Fehler " + r.status));
  return j;
}
