<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08080c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Recap">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Gaming Recap</title>
<style>
:root{
  --bg:#08080c; --ink:#f6f4ff; --muted:#a19eb6; --line:#ffffff14; --glass:#ffffff0b; --panel:#15141c;
  --lime:#c8f135; --pink:#ff4fa3; --violet:#7a5cff; --cyan:#2ee6d6; --orange:#ff8a3d; --blue:#3d7bff; --yellow:#ffd23f;
  --r:28px; --font:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,"SF Pro Display",Roboto,sans-serif;
  --top:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font)}
body{min-height:100vh;overflow-x:hidden}
a{color:var(--cyan)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:var(--ink);background:#ffffff0f;border:1px solid var(--line);border-radius:14px;padding:11px 14px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--violet)}
select option{background:#15141c}
code{background:#ffffff12;padding:1px 6px;border-radius:6px;font-size:.92em}

/* ---------- Kopf & Navigation ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(12px + var(--top)) 18px 12px;
  background:linear-gradient(#08080cf5,#08080cc0 70%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.logo{font-weight:900;font-size:22px;letter-spacing:-.5px;white-space:nowrap}
.logo b{background:linear-gradient(90deg,var(--lime),var(--cyan) 45%,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.spacer{flex:1}
.sync{font-size:12px;color:var(--muted);text-align:right;line-height:1.2}
.ibtn{width:40px;height:40px;border-radius:50%;background:var(--glass);border:1px solid var(--line);display:grid;place-items:center;flex:none;position:relative}
.ibtn:hover{border-color:#ffffff40}
.ibtn svg{width:19px;height:19px}
.ibtn .badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--pink);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.deskNav{display:none;gap:4px;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:4px;margin-left:18px}
.deskNav a{padding:8px 16px;border-radius:999px;color:var(--muted);text-decoration:none;font-weight:600}
.deskNav a.on{background:var(--ink);color:var(--bg)}
.tabbar{position:fixed;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));z-index:30;display:flex;
  background:#17161fe8;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:24px;padding:5px}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;border-radius:18px;
  color:var(--muted);text-decoration:none;font-size:10.5px;font-weight:700}
.tabbar a svg{width:22px;height:22px}
.tabbar a.on{color:var(--bg);background:var(--ink)}
@media(min-width:1000px){.tabbar{display:none}.deskNav{display:flex}}
.playing{display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:18px;background:#c8f13518;border:1px solid #c8f13544;margin-bottom:14px;font-weight:700}
.playing i{width:10px;height:10px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 0 #c8f135aa;animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 10px #c8f13500}100%{box-shadow:0 0 0 0 #c8f13500}}

main{max-width:1240px;margin:0 auto;padding:4px 16px 120px}
@media(min-width:1000px){main{padding:8px 28px 60px}}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase;opacity:.75}
.h1{font-size:clamp(30px,7vw,52px);font-weight:900;letter-spacing:-1.5px;line-height:1;margin:6px 0 18px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 14px}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:9px 16px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-weight:600;font-size:14px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip small{opacity:.6;margin-left:4px}

/* ---------- Bento ---------- */
.bento{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.card{grid-column:span 12;border-radius:var(--r);padding:24px;position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--line)}
@media(min-width:1000px){.s7{grid-column:span 7}.s5{grid-column:span 5}.s6{grid-column:span 6}.s4{grid-column:span 4}.s8{grid-column:span 8}.s3{grid-column:span 3}}
@media(min-width:640px) and (max-width:999px){.m6{grid-column:span 6}}
.card h3{margin:0 0 16px;font-size:13px;font-weight:800;letter-spacing:2px;text-transform:uppercase;opacity:.8}
.reveal{opacity:0;transform:translateY(24px) scale(.98);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}

.hero{min-height:360px;display:flex;flex-direction:column;justify-content:flex-end;padding:30px;border:0;
  background:radial-gradient(60% 80% at 15% 20%,#ff4fa3 0,transparent 60%),radial-gradient(50% 70% at 85% 10%,#7a5cff 0,transparent 60%),
  radial-gradient(60% 80% at 70% 100%,#ff8a3d 0,transparent 60%),#2a0f3a;background-size:140% 140%;animation:mesh 14s ease-in-out infinite alternate}
@keyframes mesh{0%{background-position:0% 0%}100%{background-position:100% 100%}}
.hero .num{font-size:clamp(84px,24vw,210px);font-weight:900;line-height:.85;letter-spacing:-.06em;margin:10px 0 2px}
.hero .unit{font-size:clamp(22px,5vw,34px);font-weight:800;letter-spacing:-.5px}
.hero .sub{margin-top:10px;font-size:16px;opacity:.9;max-width:560px}
.hstats{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.hstat{background:#0000002e;backdrop-filter:blur(6px);border-radius:18px;padding:10px 16px}
.hstat b{font-size:22px;font-weight:900;display:block;line-height:1.1}
.hstat span{font-size:12px;opacity:.8}

.topg{min-height:340px;padding:0;display:flex;align-items:flex-end;border:0;cursor:pointer}
.topg .bgimg{position:absolute;inset:0}
.topg .bgimg img,.topg .bgimg .ph{width:100%;height:100%;object-fit:cover}
.topg::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#08080c 5%,#08080caa 45%,transparent 80%)}
.topg .in{position:relative;z-index:1;padding:26px;width:100%}
.topg .rank1{position:absolute;right:16px;top:-6px;z-index:1;font-size:150px;font-weight:900;line-height:1;color:transparent;-webkit-text-stroke:2px #ffffffaa;letter-spacing:-8px}
.topg .t{font-size:clamp(26px,5vw,40px);font-weight:900;letter-spacing:-1px;line-height:1.05;margin:6px 0 8px}

.lime{background:var(--lime);color:#111;border:0}
.pinkc{background:var(--pink);color:#160411;border:0}
.cyanc{background:var(--cyan);color:#04201d;border:0}
.violetc{background:var(--violet);color:#fff;border:0}
.orangec{background:var(--orange);color:#200c00;border:0}
.yellowc{background:var(--yellow);color:#1d1600;border:0}
.big{font-size:clamp(56px,12vw,96px);font-weight:900;letter-spacing:-.05em;line-height:.9}
.mid{font-size:clamp(34px,7vw,52px);font-weight:900;letter-spacing:-1.5px;line-height:1}
.devrow{display:flex;align-items:center;gap:10px;margin-top:12px;font-weight:700}
.devrow .lbl{width:100px}
.devrow .trk{flex:1;height:14px;border-radius:999px;background:#00000022;overflow:hidden}
.devrow .trk div{height:100%;border-radius:999px;background:#111;transition:width 1.2s cubic-bezier(.2,.7,.2,1)}
.devrow .v{width:80px;text-align:right}

.rail{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:6px 0 4px;scroll-snap-type:x mandatory}
.rail::-webkit-scrollbar{display:none}
.rk{flex:none;display:flex;align-items:flex-end;scroll-snap-align:start;cursor:pointer;padding-bottom:46px}
.rk .n{font-size:120px;font-weight:900;line-height:.8;color:#08080c;-webkit-text-stroke:2.5px #ffffffcc;letter-spacing:-10px;margin-right:-12px;position:relative;z-index:0;padding-bottom:2px}
.rk .p{width:130px;position:relative;z-index:1}
@media(min-width:1000px){.rk .p{width:150px}}
.poster{aspect-ratio:2/3;border-radius:16px;overflow:hidden;background:#1d1c26;position:relative;box-shadow:0 10px 30px #0008}
.poster img,.poster .ph{width:100%;height:100%;object-fit:cover;display:block}
.poster .ph{display:flex}
.rk .meta{position:absolute;top:100%;left:0;right:0;font-size:13px;margin-top:8px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk .meta span{display:block;color:var(--muted);font-weight:600}
.ph{display:flex;align-items:flex-end;padding:12px;font-weight:900;font-size:16px;line-height:1.1;color:#fff;letter-spacing:-.3px}

.pbar{display:flex;align-items:center;gap:12px;padding:9px 0}
.pbar .dot{width:12px;height:12px;border-radius:50%;flex:none}
.pbar .nm{width:110px;font-weight:700;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar .trk{flex:1;height:10px;border-radius:999px;background:#ffffff10;overflow:hidden}
.pbar .trk div{height:100%;border-radius:999px;transition:width 1.2s cubic-bezier(.2,.7,.2,1)}
.pbar .v{width:76px;text-align:right;font-weight:700;font-size:14px}
.inv .trk{background:#00000020}.inv .trk div{background:#160411}

.cols{display:flex;align-items:flex-end;gap:10px;height:170px;margin-top:10px}
.cols .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.cols .c div{width:100%;border-radius:12px 12px 4px 4px;background:#04201d;transition:height 1.2s cubic-bezier(.2,.7,.2,1);min-height:4px}
.cols .c span{font-size:12px;font-weight:800}
.cols.thin{gap:3px}.cols.thin .c div{border-radius:6px 6px 2px 2px}.cols.thin .c span{font-size:10px}

.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.fact{border-radius:22px;padding:18px;min-height:140px;display:flex;flex-direction:column}
.fact small{font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;opacity:.75}
.fact b{font-size:28px;font-weight:900;letter-spacing:-.8px;line-height:1.05;margin:auto 0 4px;word-break:break-word}
.fact span{font-size:13px;opacity:.85}

.ring{--p:0;width:150px;height:150px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--lime) calc(var(--p)*1%),#ffffff1a 0)}
.ring>div{width:118px;height:118px;border-radius:50%;background:var(--panel);display:grid;place-items:center;text-align:center}
.violetc .ring>div{background:var(--violet)}
.ring b{font-size:34px;font-weight:900;line-height:1}
.ring span{font-size:11px;opacity:.75;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 22px;border-radius:999px;font-weight:800;font-size:15px;background:var(--ink);color:var(--bg)}
.btn.ghost{background:var(--glass);color:var(--ink);border:1px solid var(--line)}
.btn.limeb{background:var(--lime);color:#111}
.btn.small{padding:9px 14px;font-size:13.5px}
.btn:disabled{opacity:.5}
.notice{border-radius:20px;padding:14px 18px;background:#ffffff0d;border:1px solid var(--line);margin-bottom:14px;font-size:14px}
.stat3{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:1000px){.stat3{grid-template-columns:repeat(4,1fr)}}
.tile{border-radius:22px;padding:18px;background:var(--panel);border:1px solid var(--line)}
.tile small{display:block;font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.tile b{display:block;font-size:30px;font-weight:900;letter-spacing:-1px;margin-top:6px;line-height:1.05}
.tile span{font-size:13px;color:var(--muted)}

/* ---------- Heatmap ---------- */
.heatwrap{overflow-x:auto;scrollbar-width:thin;padding-bottom:6px}
.heat{display:grid;grid-template-rows:repeat(7,13px);grid-auto-flow:column;grid-auto-columns:13px;gap:3px;width:max-content}
.heat i{border-radius:3px;background:#ffffff0d}
.heat i.l1{background:#c8f13540}.heat i.l2{background:#c8f13570}.heat i.l3{background:#c8f135a8}.heat i.l4{background:#c8f135}
.heat i.x{background:transparent}
.months{display:grid;grid-auto-flow:column;grid-auto-columns:16px;font-size:11px;color:var(--muted);width:max-content;margin-bottom:6px}
@media(min-width:1000px){.heat{grid-template-rows:repeat(7,17px);grid-auto-columns:17px;gap:4px}.months{grid-auto-columns:21px}}
.legend{display:flex;gap:4px;align-items:center;font-size:11px;color:var(--muted);margin-top:8px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}

/* ---------- Bibliothek ---------- */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.toolbar input[type=search],.toolbar input[type=text]{flex:1;min-width:180px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
@media(min-width:1000px){.grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:20px}}
@media(max-width:480px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}}
.gcard{cursor:pointer}
.gcard .poster::after{content:"";position:absolute;inset:50% 0 0;background:linear-gradient(0deg,#000d,transparent)}
.gcard .ov{position:absolute;left:12px;right:12px;bottom:10px;z-index:1}
.gcard .ov b{display:block;font-size:20px;font-weight:900;letter-spacing:-.5px}
.gcard .dev{position:absolute;top:10px;right:10px;z-index:1;display:flex;gap:4px}
.gcard .dev i{width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 2px #0008}
.gcard .nm{margin-top:8px;font-weight:700;font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gcard .poster{transition:transform .2s}
.gcard:hover .poster{transform:translateY(-4px)}

/* ---------- Backlog ---------- */
.bl-layout{display:block}
.bl-aside .card{margin-bottom:14px}
.bl-filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 14px}
.bl-filters::-webkit-scrollbar{display:none}
@media(min-width:1000px){
  .bl-layout{display:grid;grid-template-columns:330px 1fr;gap:24px;align-items:start}
  .bl-aside{position:sticky;top:84px}
  .bl-filters{flex-direction:column;overflow:visible;gap:4px}
  .bl-filters .chip{border-radius:14px;display:flex;justify-content:space-between;background:transparent;border-color:transparent}
  .bl-filters .chip.on{background:var(--ink)}
  .bl-filters .chip:not(.on):hover{background:var(--glass)}
}
.bhero{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.bhero .nums{display:flex;gap:22px;flex-wrap:wrap}
.bhero .nums b{font-size:34px;font-weight:900;display:block;line-height:1}
.bhero .nums span{font-size:12px;opacity:.75;font-weight:700}
.brow{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:14px;padding:10px;border-radius:18px;cursor:pointer}
.brow:hover{background:#ffffff08}
.brow .poster{width:52px;border-radius:10px;box-shadow:none}
.brow .ph,.rk .ph{font-size:0}
.brow .mid2{min-width:0}
.brow .mid2 b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .mid2 b .mc{height:22px;min-width:28px;font-size:12.5px;border-radius:7px;margin-right:8px;vertical-align:1px}
.brow .mid2 span{font-size:13px;color:var(--muted)}
.brow .cd{display:none;color:var(--muted);font-size:14px;font-weight:600;text-align:right}
.bhead{display:none}
@media(min-width:1000px){
  .brow{grid-template-columns:52px 1fr 150px 90px 90px 90px}
  .brow .cd{display:block}
  .bhead{display:grid;grid-template-columns:52px 1fr 150px 90px 90px 90px;gap:14px;padding:0 10px 8px;font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
  .bhead span:nth-child(n+4){text-align:right}
}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;font-size:12.5px;font-weight:800;white-space:nowrap;justify-self:start}
.pill.auto{outline:1.5px dashed #ffffff55;outline-offset:-1.5px}

/* ---------- Dialoge ---------- */
dialog{border:0;padding:0;background:#121119;color:var(--ink);max-width:640px;width:100%;border-radius:30px;max-height:92vh;overflow:hidden}
dialog::backdrop{background:#000b;backdrop-filter:blur(4px)}
@media(max-width:640px){dialog{margin:auto 0 0;border-radius:30px 30px 0 0;max-height:94vh;max-width:100%}}
@media(min-width:1000px){#detail{max-width:900px}}
dialog[open]{animation:up .35s cubic-bezier(.2,.7,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.dscroll{overflow:auto;max-height:inherit;overscroll-behavior:contain}
.dclose{position:absolute;top:14px;right:14px;z-index:3;background:#000a}
.dban{height:200px;position:relative}
@media(min-width:1000px){.dban{height:260px}}
.dban img,.dban .ph{width:100%;height:100%;object-fit:cover}
.dban::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#121119,transparent 70%)}
.dhead{display:flex;gap:16px;align-items:flex-end;margin:-80px 22px 0;position:relative;z-index:1}
.dhead .poster{width:110px;flex:none}
.dhead h2{margin:0 0 6px;font-size:26px;font-weight:900;letter-spacing:-.6px;line-height:1.1}
.dbody{padding:18px 22px 26px}
.dgrid{display:block}
@media(min-width:1000px){.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:28px}}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}
.kv div{background:#ffffff08;border-radius:16px;padding:12px}
.kv small{display:block;font-size:11px;color:var(--muted);font-weight:800;letter-spacing:1px;text-transform:uppercase}
.kv b{font-size:16px}
.hl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.hl div{border-radius:16px;padding:12px;background:#2ee6d614;border:1px solid #2ee6d630}
.hl small{display:block;font-size:11px;color:var(--cyan);font-weight:800;text-transform:uppercase;letter-spacing:1px}
.hl b{font-size:18px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:8px 0 16px}
.sgrid button{padding:11px 10px;border-radius:14px;background:#ffffff0b;border:2px solid transparent;font-weight:700;font-size:13.5px;text-align:left}
.sgrid button.on{border-color:currentColor}
.stars{display:flex;gap:4px;margin:6px 0 16px}
.stars button{font-size:30px;line-height:1;color:#ffffff30}
.stars button.on{color:var(--yellow)}
textarea{width:100%;min-height:80px;resize:vertical}
.secttl{font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.tagrow{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12.5px;padding:4px 10px;border-radius:999px;background:#ffffff10;font-weight:600}
.tag i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.inl{display:flex;gap:8px;align-items:center}
.inl input{width:110px}

/* Segmente, Tier-Liste, Wunschliste, Abzeichen, Ziele, Freunde */
.seg{display:inline-flex;gap:4px;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:4px;margin-bottom:16px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{padding:8px 16px;border-radius:999px;font-weight:700;color:var(--muted);white-space:nowrap}
@media(max-width:480px){.seg button{padding:8px 12px;font-size:14px}}
.seg button.on{background:var(--ink);color:var(--bg)}
.tierrow{display:grid;grid-template-columns:60px 1fr;gap:10px;margin-bottom:10px;min-height:96px}
.tierrow .tl{border-radius:16px;display:grid;place-items:center;font-size:30px;font-weight:900;color:#111}
.tierrow .tz{display:flex;flex-wrap:wrap;gap:8px;padding:8px;border-radius:16px;background:#ffffff08;border:2px dashed transparent;align-content:flex-start;min-height:96px}

function ph(title){ const [a,b]=PH_GRADS[hash(title)%PH_GRADS.length]; return `<div class="ph" style="background:linear-gradient(140deg,${a},${b})">${esc(title)}</div>`; }
function img(srcs, title){
  srcs = (srcs||[]).filter(Boolean);
  if (!srcs.length) return ph(title);
  return `<img loading="lazy" decoding="async" alt="" src="${esc(srcs[0])}" data-fb="${esc(srcs.slice(1).join("|"))}" data-t="${esc(title)}" onerror="imgFail(this)">`;
}
window.imgFail = el => {
  const fb = (el.dataset.fb||"").split("|").filter(Boolean);
  if (fb.length){ el.dataset.fb = fb.slice(1).join("|"); el.src = fb[0]; }
  else el.outerHTML = ph(el.dataset.t||"");
};
const cleanTitle = t => String(t||"").replace(/\s*\((?:PlayStation\s?®?\s?[45]|PS[45]|Xbox One|Xbox Series X\s?\|\s?S|Windows|PC)\)/gi,"")
  .replace(/\s+(?:for\s+)?Xbox Series X\s?\|\s?S\b/gi,"").replace(/\s*-\s*Windows(?: 10)?(?: Edition)?$/i,"").replace(/\s*-\s*PC Edition$/i,"")
  .replace(/[™®](?=\w)/g," ").replace(/[™®]/g,"").replace(/\s{2,}/g," ").trim();
const mcClass = v => v >= 75 ? "g" : v >= 50 ? "y" : "r";
const mcBadge = (v, cls="") => v ? `<span class="mc ${mcClass(v)} ${cls}" title="Fachpresse-Wertung">${Math.round(v)}</span>` : "";
function revLabel(p, n){
  if (n < 10) return "Zu wenige Rezensionen";
  if (p >= 95 && n >= 500) return "Äußerst positiv";
  if (p >= 80) return n >= 50 ? "Sehr positiv" : "Positiv";

const platLabel = r => r.device === "PC" ? r.store : r.device;
const dayKey = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

/* ================= Verschlüsselung (Handy-App) ================= */
const enc = new TextEncoder();
const b64d = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
function b64e(u8){ let s=""; for (let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000)); return btoa(s); }
async function deriveKeys(pass, salt, it){
  const base = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveBits"]);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt,iterations:it}, base, 512));
  const ek = await crypto.subtle.importKey("raw", bits.slice(0,32), {name:"HMAC",hash:"SHA-256"}, false, ["sign"]);
  const mk = await crypto.subtle.importKey("raw", bits.slice(32), {name:"HMAC",hash:"SHA-256"}, false, ["sign","verify"]);
  return {ek, mk};
}
async function keystream(ek, nonce, len){
  const n = Math.ceil(len/32), out = new Uint8Array(n*32);
  for (let i=0;i<n;i+=1024){
    const ps = [];
    for (let j=i;j<Math.min(n,i+1024);j++){ const m=new Uint8Array(nonce.length+4); m.set(nonce); new DataView(m.buffer).setUint32(nonce.length,j); ps.push(crypto.subtle.sign("HMAC",ek,m)); }
    (await Promise.all(ps)).forEach((r,k)=>out.set(new Uint8Array(r),(i+k)*32));
  }
  return out.subarray(0,len);
}
const concat = (...a) => { const o=new Uint8Array(a.reduce((s,x)=>s+x.length,0)); let p=0; a.forEach(x=>{o.set(x,p);p+=x.length}); return o; };
async function decryptBlob(text, pass){
  const d = JSON.parse(text), salt=b64d(d.salt), nonce=b64d(d.nonce), ct=b64d(d.ct), tag=b64d(d.tag);
  const {ek, mk} = await deriveKeys(pass, salt, d.it||310000);
  if (!await crypto.subtle.verify("HMAC", mk, tag, concat(salt,nonce,ct))) throw new Error("Falsches Passwort");
  const ks = await keystream(ek, nonce, ct.length), pt = new Uint8Array(ct.length);
  for (let i=0;i<ct.length;i++) pt[i] = ct[i]^ks[i];
  let bytes = pt;
  if (d.gz) bytes = new Uint8Array(await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer());
  return JSON.parse(new TextDecoder().decode(bytes));
}
async function encryptObj(obj, pass){
  const it = 310000, salt = crypto.getRandomValues(new Uint8Array(16)), nonce = crypto.getRandomValues(new Uint8Array(12));
  const pt = enc.encode(JSON.stringify(obj)), {ek, mk} = await deriveKeys(pass, salt, it);
  const ks = await keystream(ek, nonce, pt.length), ct = new Uint8Array(pt.length);
  for (let i=0;i<pt.length;i++) ct[i] = pt[i]^ks[i];
  const tag = new Uint8Array(await crypto.subtle.sign("HMAC", mk, concat(salt,nonce,ct)));
  return JSON.stringify({v:1,it,gz:false,salt:b64e(salt),nonce:b64e(nonce),ct:b64e(ct),tag:b64e(tag)});
}

const store = {
  get(k, d){ try { const v = localStorage.getItem(k) ?? sessionStorage.getItem(k); return v===null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v, persist=true){ try { (persist?localStorage:sessionStorage).setItem(k, JSON.stringify(v)); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); sessionStorage.removeItem(k); } catch(e){} },
};
const pass = () => store.get("gr_pass", null);
const edits = () => store.get("gr_edits", []);

/* ================= Daten laden ================= */
async function load(){
  if (CLOUD) return loadCloud();
  S.yearPM = undefined;
  try { S.data = await (await fetch(`/api/data?period=${S.period}`)).json(); }
  catch(e){ $("#view").innerHTML = `<div class="empty"><div class="big">📡</div><h2>Keine Verbindung</h2><p class="help">Läuft Gaming Recap noch auf deinem PC?</p></div>`; return; }
  applyEstimate(); buildGroups(); header(); route();
  if (S.data.syncing) setTimeout(load, 2500);
}

async function loadCloud(force){
  if (!pass()) return lockScreen();
  if (!S.snap || force){
    let text = null;
    try { const r = await fetch(`data.enc?t=${Date.now()}`, {cache:"no-store"}); if (r.ok) text = await r.text(); } catch(e){}
    if (text) store.set("gr_blob", text); else text = store.get("gr_blob", null);
    if (!text){ $("#view").innerHTML = `<div class="empty"><div class="big">☁️</div><h2>Noch keine Daten</h2><p class="help">Dein PC hat noch nichts hochgeladen. Prüfe in den Einstellungen am PC den Bereich „Handy-App“.</p></div>`; return; }
    try { S.snap = await decryptBlob(text, pass()); }
    catch(e){ store.del("gr_pass"); return lockScreen("Das Passwort passt nicht."); }
    // Bereits vom PC übernommene Änderungen aus der Warteschlange entfernen
    const meta = S.snap.meta || {};
    store.set("gr_edits", edits().filter(e => {
      if (e.kind === "kv") return !(S.snap.goals_updated && Date.parse(S.snap.goals_updated) >= e.ts);
      const m = meta[norm(e.key)]; return !(m && m.updated && Date.parse(m.updated) >= e.ts) && Date.now()-e.ts < 30*86400e3; }));
  }
  const snap = S.snap, meta = {...(snap.meta||{})};
  let goals = snap.goals || {};
  for (const e of edits()){
    if (e.kind === "kv"){ if (e.key === "goals") goals = e.value; continue; }
    const k = norm(e.key); meta[k] = {...(meta[k]||{}), ...pick(e,["status","rating","note","tier","hide"]), updated:new Date(e.ts).toISOString()};
  }
  const p = S.period === "all" ? null : (snap.periods||{})[S.period];
  S.data = {last_sync:snap.last_sync, sources:snap.sources||{}, games:snap.games||[], meta, hltb:snap.hltb||{},
    sessions:snap.sessions||[], status_log:snap.status_log||[], goals, steam:snap.steam||{}, prefs:snap.prefs||{},
    playing:[], can_edit:false, period: p ? p.info : {period:"all"}, period_minutes: p ? p.pm : null};
  S.yearPM = (snap.periods||{}).year ? snap.periods.year.pm : null; S.yearInfo = (snap.periods||{}).year ? {...snap.periods.year.info} : null;
  if (S.yearInfo && !S.yearInfo.complete){ S.yearPM = estimateYear(new Date().getFullYear(), S.yearPM); S.yearInfo.estimated = true; }
  applyEstimate(); buildGroups(); header(); route(); flushEdits();
}
const pick = (o, ks) => Object.fromEntries(ks.filter(k=>k in o).map(k=>[k,o[k]]));

/* ================= Schätzung fürs laufende Jahr =================
   Die Plattformen liefern nur Gesamtzeiten. Solange der Verlauf das Jahr noch nicht
   abdeckt, verteilen wir die Spielzeit gleichmäßig zwischen erstem und letztem Spieltag
   und nehmen den Anteil, der in dieses Jahr fällt. */
function estimateYear(year, base){
  const ys = new Date(year,0,1), now = new Date(), out = {...(base||{})};
  for (const r of S.data.games){
    const mins = r.minutes||0, last = pdate(r.last_played);
    if (!mins || !last || last < ys) continue;
    let first = pdate(r.first_played);
    const ry = Number(r.release_year), rel = ry >= 1970 && ry <= year ? new Date(ry,0,1) : null;
    if (!first) first = rel && rel > new Date(last - 3*365*864e5) ? rel : new Date(last - 2*365*864e5);
    const end = last > now ? now : last;
    const share = first >= ys ? 1 : Math.max(0, Math.min(1, (end - ys) / Math.max(1, end - first)));
    const v = Math.round(mins * share);
    if (v > (out[r.id]||0)) out[r.id] = v;
  }
  return out;
}
function applyEstimate(){
  const p = S.data.period || {};
  if (p.period === "year" && !p.complete){ S.data.period_minutes = estimateYear(new Date().getFullYear(), S.data.period_minutes); p.estimated = true; }
}

/* ================= Gruppen bauen ================= */
function autoStatus(g){
  const c = (g.completion||"").toLowerCase();
  if (c){
    if (/not|nicht|ungespielt/.test(c)) return "ungespielt";
    if (/plan|geplant|wunsch/.test(c)) return "als_naechstes";
    if (/hold|pausiert|pause/.test(c)) return "pausiert";
    if (/abandon|abgebrochen/.test(c)) return "abgebrochen";
    if (/complet|abgeschlossen|100|komplett/.test(c)) return "komplett";
    if (/beaten|beendet|durch|geschafft/.test(c)) return "durchgespielt";
  }
  const ft = g.features.map(x=>x.toLowerCase());
  const mp = ft.some(x=>/multi|online|pvp|mmo/.test(x)), sp = ft.some(x=>/single|einzel/.test(x));
  if ((mp && !sp) || g.genres.some(x=>/battle royale|mmo/i.test(x))) return "endlos";
  if (c && /play|spiel/.test(c)) return "angefangen";
  return g.pcMinutes > 0 ? "angefangen" : "ungespielt";
}
function coverOrder(urls, extra){
  // Playnite-Cover (nur am PC erreichbar) > Steam > IGDB > Plattform-Bild
  const pn=[], st=[], nat=[];
  for (const u of urls){ if (u.startsWith("/api/img")) { if (LOCAL) pn.push(u); } else if (u.includes("steamstatic")) st.push(u); else nat.push(u); }
  return [...new Set([...pn, ...st, ...(extra||[]), ...nat])];
}
const DEFAULT_BL_STORES = ["Steam","Ubisoft","EA","GOG","Epic Games"];
const backlogStores = () => ((S.data && S.data.prefs && S.data.prefs.backlog_stores) || DEFAULT_BL_STORES);
function buildGroups(){
  const d = S.data, pm = d.period_minutes, m = new Map();
  for (const r of d.games){
    const k = norm(r.title) || r.id;
    let g = m.get(k);
    if (!g){ g = {key:k, title:r.title, recs:[], minutes:0, pmin:0, pcMinutes:0, plats:{}, devs:{}, pc:false, genres:new Set(), features:new Set(),
      devsList:new Set(), year:null, added:null, last:null, installed:false, hidden:true, completion:null, first:null}; m.set(k,g); }
    g.recs.push(r);
    const mins = r.minutes||0, pmins = pm ? (pm[r.id]||0) : mins;
    g.minutes += mins; g.pmin += pmins;
    const pl = platLabel(r);
    g.plats[pl] = (g.plats[pl]||0) + pmins;
    g.devs[r.device] = (g.devs[r.device]||0) + pmins;
    if (r.device === "PC"){
      g.pc = true; g.pcMinutes += mins;
      if (!r.family && backlogStores().includes(r.store)) g.owned = true;
      if (!r.hidden) g.hidden = false;
      (r.genres||[]).forEach(x=>g.genres.add(x)); (r.features||[]).forEach(x=>g.features.add(x));
      (r.developers||[]).forEach(x=>g.devsList.add(x));
      const ry = Number(r.release_year);
      if (ry >= 1970 && ry <= new Date().getFullYear()+1 && (!g.year || ry < g.year)) g.year = ry;
      const a = pdate(r.added); if (a && (!g.added || a < g.added)) g.added = a;
      if (r.installed) g.installed = true;
      if (r.completion && !g.completion) g.completion = r.completion;
    }
    const l = pdate(r.last_played); if (l && (!g.last || l > g.last)) g.last = l;
    const f = pdate(r.first_played); if (f && (!g.first || f < g.first)) g.first = f;
  }
  for (const g of m.values()){
    const recs = [...g.recs].sort((a,b)=>(b.minutes||0)-(a.minutes||0));
    const pcRec = recs.find(r=>r.device==="PC"); g.title = cleanTitle(pcRec ? pcRec.title : recs[0].title) || recs[0].title;
    g.hltb = (d.hltb||{})[g.key] || null;
    const hImg = g.hltb && g.hltb.image ? [g.hltb.image] : [];
    g.covers = coverOrder(recs.flatMap(r=>r.covers||[]), hImg);
    g.banners = coverOrder(recs.flatMap(r=>r.banners||[]), hImg).concat(g.covers.filter(c=>!c.includes("library_600x900")));
    g.genres = [...g.genres]; g.features = [...g.features]; g.devsList = [...g.devsList];
    g.meta = d.meta[g.key] || {};
    g.tier = g.meta.tier || null;
    const sr = recs.find(r=>r.steam_appid); g.appid = sr ? sr.steam_appid : null;
    const sx = d.steam || {};
    g.ach = g.appid && sx.ach ? sx.ach[g.appid] || null : null;
    g.price = g.appid && sx.prices ? sx.prices[g.appid] || null : null;
    const scr = g.appid && sx.scores ? sx.scores[g.appid] || null : null;
    const pnCritic = Math.max(0, ...recs.map(r=>Number(r.critic)||0));
    g.critic = scr && scr.mc ? scr.mc : pnCritic || (g.hltb && g.hltb.critic) || null;
    g.criticSrc = scr && scr.mc ? "Metacritic" : pnCritic ? "Fachpresse" : g.critic ? "IGDB" : null;
    g.rev = scr && scr.rt ? {pct: scr.rp, total: scr.rt} : null;
    g.auto = autoStatus(g);
    g.status = g.meta.status || g.auto;
    g.isAuto = !g.meta.status;
    g.remaining = remaining(g);
  }
  S.allGroups = [...m.values()];
  for (const g of S.allGroups) g.hide = !!g.meta.hide;
  S.groups = S.allGroups.filter(g=>!g.hide);
  for (const g of S.allGroups) for (const r of g.recs){ const k = norm(r.title); if (k && !m.has(k)) m.set(k, g); }
  S.gmap = m;
}
function remaining(g){
  if (!g.hltb || !g.hltb.main || !g.pc || SMAP[g.status].g !== "open") return null;
  const main = g.hltb.main;
  return g.status==="angefangen" || g.status==="pausiert" ? Math.max(main - g.pcMinutes, main*0.15) : main;
}
const val = g => g.pmin;

function afterRender(){
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ e.target.classList.add("in"); animate(e.target); io.unobserve(e.target);} }), {threshold:.1});
  document.querySelectorAll(".reveal").forEach(el=>io.observe(el));
  document.querySelectorAll(".heatwrap").forEach(el=>el.scrollLeft = el.scrollWidth);
}
function animate(root){
  root.querySelectorAll("[data-count]").forEach(el=>{
    const to = Number(el.dataset.count), dec = Number(el.dataset.dec||0), t0 = performance.now(), dur = 1400;
    const step = t => { const p = Math.min(1,(t-t0)/dur), e = 1-Math.pow(1-p,4); el.textContent = num(to*e, dec); if (p<1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
  root.querySelectorAll("[data-w]").forEach(el=>requestAnimationFrame(()=>{ el.style.width = el.dataset.w; }));
  root.querySelectorAll("[data-h]").forEach(el=>requestAnimationFrame(()=>{ el.style.height = el.dataset.h; }));
}

/* ================= Session-Auswertung ================= */
function sessionStats(fromTs){
  const ss = (S.data.sessions||[]).filter(s=>!fromTs || s[1] >= fromTs);
  const perDay = {}, hours = new Array(24).fill(0), wd = new Array(7).fill(0), perGame = {};
  let longest = null, total = 0;
  for (const [k, s, sec] of ss){
    const d = new Date(s*1000), min = sec/60;
    total += min;
    perDay[dayKey(d)] = (perDay[dayKey(d)]||0) + min;
    wd[(d.getDay()+6)%7] += min;
    perGame[k] = (perGame[k]||0) + min;
    let t = s; const end = s + sec;
    while (t < end){ const x = new Date(t*1000), h = x.getHours(); x.setMinutes(60,0,0); const nt = Math.min(end, x.getTime()/1000); hours[h] += (nt-t)/60; t = nt; }
    if (!longest || sec > longest[2]) longest = [k, s, sec];
  }
  const days = Object.keys(perDay).sort();
  let best = 0, run = 0, prev = null;
  for (const dk of days){ const d = new Date(dk+"T12:00"); run = prev && (d-prev)/864e5 < 1.5 ? run+1 : 1; best = Math.max(best, run); prev = d; }
  const set = new Set(days); let curStreak = 0; const t = new Date(); t.setHours(12,0,0,0);
  if (!set.has(dayKey(t))) t.setDate(t.getDate()-1);
  while (set.has(dayKey(t))){ curStreak++; t.setDate(t.getDate()-1); }
  const win = {Nachteule:[22,23,0,1,2,3,4], Frühaufsteher:[5,6,7,8,9,10], Mittagszocker:[11,12,13,14,15,16], "Feierabend-Gamer":[17,18,19,20,21]};
  const wsum = Object.fromEntries(Object.entries(win).map(([k,hs])=>[k, hs.reduce((s,h)=>s+hours[h],0)]));
  const type = total ? Object.entries(wsum).sort((a,b)=>b[1]-a[1])[0][0] : null;
  const since = ss.length ? ss[0][1] : null;
  return {ss, perDay, hours, wd, perGame, longest, total, days, best, curStreak, type, night: total ? wsum.Nachteule/total : 0,
    weekend: total ? (wd[5]+wd[6])/total : 0, since, avg: ss.length ? total/ss.length : 0};
}
function titleOf(k){ const g = S.gmap.get(k); return g ? g.title : k; }
function weeklyPace(){
  const ss = S.data.sessions||[]; if (!ss.length) return null;
  const now = Date.now()/1000, first = ss[0][1];
  if (now - first < 7*86400) return null;
  const from = Math.max(first, now - 56*86400);
  const min = ss.filter(s=>s[1]>=from).reduce((a,s)=>a+s[2]/60,0);
  return min / ((now-from)/(7*86400));
}

function facts(played,total,plats){
  const f = [];

  const st = sessionStats(periodStart());
  if (st.ss.length >= 5){
    f.push([st.type, `${num(st.night*100)} %`, "deiner PC-Zeit zwischen 22 und 5 Uhr"]);
    if (st.longest) f.push(["Längste Session", hrs(st.longest[2]/60), `${titleOf(st.longest[0])} am ${fdate(new Date(st.longest[1]*1000))}`]);
    if (st.best > 1) f.push(["Längste Serie", `${st.best} Tage`, "am Stück gezockt"]);
  }
  const c100 = played.filter(g=>val(g)>=6000).length;
  f.push(["100-Stunden-Club", `${c100} ${c100===1?"Spiel":"Spiele"}`, c100 ? "Echte Langzeitbeziehungen" : "Noch kein Mitglied"]);
  const tempo = tempoStats();
  if (tempo) f.push(["Tempo", `${num(Math.abs(tempo.pct))} % ${tempo.pct<0?"schneller":"langsamer"}`, `als der Durchschnitt laut IGDB (${tempo.n} Spiele)`]);
  const sniff = played.filter(g=>val(g)<60).length;
  if (sniff) f.push(["Schnupperer", `${sniff} ${sniff===1?"Spiel":"Spiele"}`, "unter einer Stunde angespielt"]);
  const multi = played.filter(g=>Object.values(g.plats).filter(Boolean).length>1);
  if (multi.length) f.push(["Plattform-Hopper", `${multi.length}×`, `z. B. ${multi[0].title}`]);
  if (S.period==="all"){
    const pr = (S.data.steam||{}).prices || {};
    const owned = S.groups.filter(g=>g.appid && pr[g.appid]);
    const worth = owned.reduce((s,g)=>s+(pr[g.appid].orig||0),0);
    if (worth > 0) f.push(["Kontowert", euro(worth), `für ${owned.length} Steam-Spiele zum heutigen Normalpreis`]);
    const vals = owned.filter(g=>pr[g.appid].orig>0 && g.minutes>=120).map(g=>[g, pr[g.appid].orig/100/(g.minutes/60)]).sort((a,b)=>a[1]-b[1]);
    if (vals.length >= 3){ f.push(["Bester Deal", vals[0][0].title, `${euro(vals[0][1]*100)} pro Stunde`]); f.push(["Teuerster Spaß", vals[vals.length-1][0].title, `${euro(vals[vals.length-1][1]*100)} pro Stunde`]); }
    const pcMin = played.reduce((s,g)=>s+(g.devs.PC||0),0), pf = S.data.prefs||{};
    if (pcMin > 600){ const kwh = pcMin/60*(pf.watts||350)/1000; f.push(["Stromrechnung", euro(kwh*(pf.kwh_price||0.35)*100), `ca. ${num(kwh)} kWh am PC (${pf.watts||350} W angenommen)`]); }
    const rated = played.filter(g=>g.critic);
    if (rated.length >= 5){
      const avg = rated.reduce((s,g)=>s+g.critic*val(g),0) / rated.reduce((s,g)=>s+val(g),0);
      f.push(["Dein Geschmack", `Ø ${num(avg)} Punkte`, "Fachpresse-Wertung, gewichtet nach deiner Spielzeit"]);
      const best = [...rated].sort((a,b)=>b.critic-a.critic)[0];
      f.push(["Bestbewertet gespielt", best.title, `${best.critic} Punkte bei der Fachpresse`]);
      const odd = rated.filter(g=>g.critic<70 && val(g)>=600).sort((a,b)=>val(b)-val(a))[0];
      if (odd) f.push(["Gegen den Strom", odd.title, `nur ${odd.critic} Punkte – trotzdem ${hrs(val(odd))} gespielt`]);
    }
    const revd = played.filter(g=>g.rev && g.rev.total>=50);
    if (revd.length >= 5){ const fav = [...revd].sort((a,b)=>b.rev.pct-a.rev.pct)[0];
      f.push(["Liebling der Community", fav.title, `${fav.rev.pct} % positive Steam-Rezensionen`]); }
    const ach = Object.values((S.data.steam||{}).ach||{});
    if (ach.length) f.push(["Steam-Erfolge", num(ach.reduce((s,a)=>s+a.d,0)), `freigeschaltet in ${ach.filter(a=>a.d).length} Spielen`]);
    const devT2 = {}; for (const g of played) for (const [k,v] of Object.entries(g.devs)) devT2[k]=(devT2[k]||0)+v;
    const cons = played.filter(g=>(g.devs.PlayStation||0)+(g.devs.Xbox||0)>0).sort((a,b)=>((b.devs.PlayStation||0)+(b.devs.Xbox||0))-((a.devs.PlayStation||0)+(a.devs.Xbox||0)))[0];
    if (cons) f.push(["Konsolen-Krone", cons.title, `${hrs((cons.devs.PlayStation||0)+(cons.devs.Xbox||0))} auf der Konsole`]);
    if (devT2.PlayStation && devT2.Xbox) f.push(["PlayStation vs. Xbox", devT2.PlayStation >= devT2.Xbox ? "Team Blau" : "Team Grün",
      `${num(Math.max(devT2.PlayStation,devT2.Xbox)/Math.min(devT2.PlayStation,devT2.Xbox),1)}× mehr ${devT2.PlayStation >= devT2.Xbox ? "PlayStation" : "Xbox"}`]);
    const fr = franchises(played, val)[0];
    if (fr) f.push(["Lieblingsreihe", fr.name, `${fr.games.length} Spiele, ${hrs(fr.minutes)}`]);
    f.push(["In Arbeitstagen", `${num(total/60/8)} Tage`, "à 8 Stunden – ganz schön viel Urlaub"]);
    f.push(["Lebenszeit", `${num(total/60/8760*100,1)} %`, "eines ganzen Jahres, rund um die Uhr"]);
    const tenPlus = played.filter(g=>val(g)>=600).length;
    f.push(["Ernsthaft gespielt", `${tenPlus} Spiele`, `mit über 10 Stunden – von ${played.length}`]);
    const newest = played.filter(g=>g.year).sort((a,b)=>b.year-a.year)[0];
    if (newest) f.push(["Frischfleisch", newest.title, `erschienen ${newest.year}`]);
    const twin = played.filter(g=>Object.values(g.devs).filter(v=>v>0).length>1).sort((a,b)=>val(b)-val(a))[0];
    if (twin) f.push(["Plattform-Zwilling", twin.title, Object.entries(twin.devs).filter(x=>x[1]>0).map(([k,v])=>`${k} ${hrs(v)}`).join(" · ")]);
    const stA = sessionStats(0);
    if (stA.ss.length >= 5){
      const wd = stA.wd.indexOf(Math.max(...stA.wd));
      f.push(["Lieblingstag", ["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"][wd], `${num(stA.wd[wd]/stA.total*100)} % deiner PC-Zeit`]);
      f.push(["Ø Session", hrs(stA.avg), `bei ${stA.ss.length} Sessions am PC`]);
    }
    const oldest = played.filter(g=>g.year).sort((a,b)=>a.year-b.year)[0];
    if (oldest) f.push(["Ältester Schinken", oldest.title, `erschienen ${oldest.year}`]);
    const dv = {};
    for (const g of played) for (const x of g.devsList) dv[x]=(dv[x]||0)+val(g);
    const td = Object.entries(dv).sort((a,b)=>b[1]-a[1])[0];
    if (td) f.push(["Lieblingsstudio", td[0], `${hrs(td[1])} in deren Spielen`]);
    const bl = backlogStats();
    if (bl.unplayed) f.push(["Pile of Shame", `${bl.unplayed} Spiele`, "auf dem PC noch nie gestartet"]);
  }
  return f;
}
function tempoStats(){
  const done = S.groups.filter(g=>g.pc && SMAP[g.status].g==="done" && g.hltb && g.hltb.main && g.pcMinutes > 30);
  if (done.length < 3) return null;
  const r = done.map(g => g.pcMinutes / (g.status==="komplett" && g.hltb.comp ? g.hltb.comp : g.hltb.main)).sort((a,b)=>a-b);
  return {pct: (r[Math.floor(r.length/2)] - 1) * 100, n: done.length};
}
function platTags(plats){
  return Object.entries(plats).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1])
    .map(([p,v])=>`<span class="tag"><i style="background:${pcolor(p)}"></i>${esc(p)} · ${hrs(v)}</span>`).join("");

}

const hl = g => g.hltb && g.hltb.main ? g.hltb.main : Infinity;
function libGrid(){
  const L = S.lib, q = norm(L.q);
  const base = L.dev === "hidden" ? S.allGroups.filter(g=>g.hide) : S.groups;
  const list = base.filter(g => (!L.dev || L.dev==="hidden" || g.devs[L.dev]!==undefined) && (!q || g.key.includes(q)) && (!L.played || g.minutes>0));
  list.sort({min:(a,b)=>b.minutes-a.minutes, last:(a,b)=>(b.last||0)-(a.last||0), name:(a,b)=>a.title.localeCompare(b.title,"de"),
    year:(a,b)=>(b.year||0)-(a.year||0), added:(a,b)=>(b.added||0)-(a.added||0), hltb:(a,b)=>hl(a)-hl(b),
    critic:(a,b)=>(b.critic||0)-(a.critic||0), rev:(a,b)=>((b.rev&&b.rev.total>=50)?b.rev.pct:0)-((a.rev&&a.rev.total>=50)?a.rev.pct:0)}[L.sort]);
  $("#grid").innerHTML = list.slice(0,L.limit).map(g=>`<div class="gcard" onclick="openGame('${esc(g.key)}')">
    <div class="poster">${img(g.covers,g.title)}${mcBadge(g.critic,"mcb")}<div class="dev">${Object.keys(g.devs).map(d=>`<i style="background:${DEV_COLORS[d]}"></i>`).join("")}</div>

  $("#moreWrap").innerHTML = list.length > L.limit ? `<button class="btn ghost more" onclick="S.lib.limit+=120;libGrid()">Mehr anzeigen (${list.length-L.limit})</button>` : "";

/* ================= Backlog ================= */
const blGames = () => S.groups.filter(g=>g.pc && !g.hidden && g.owned);
function backlogStats(){
  const b = blGames(); let open=0, done=0, unplayed=0, rest=0, known=0;
  for (const g of b){ const gr = SMAP[g.status].g; if (gr==="open"){ open++; if (g.remaining!=null){ rest+=g.remaining; known++; } } if (gr==="done") done++; if (g.status==="ungespielt") unplayed++; }
  return {total:b.length, open, done, unplayed, rest, known, pct: open+done ? done/(open+done)*100 : 0};
}
function pill(g){
  const s = SMAP[g.status];
  return `<span class="pill ${g.isAuto?"auto":""}" style="background:${s.c}22;color:${s.c}">${s.e} ${s.l}</span>`;
}
function forecast(st){
  const pace = weeklyPace();
  if (!st.rest) return "";
  if (!pace) return `Prognose folgt, sobald der Tracker eine Woche gesammelt hat.`;
  const d = new Date(Date.now() + st.rest/pace*7*864e5);
  return `Bei deinem Tempo (${hrs(pace)} pro Woche) wärst du im <b>${d.toLocaleDateString("de-DE",{month:"long",year:"numeric"})}</b> durch – wenn du nur noch Backlog spielst.`;
}

  const wmx = Math.max(...st.wd, 1);

    <div class="mid">${st.weekend>.4?"Wochenend-Gamer":"Feierabend-Gamer"}</div><div style="font-weight:600;margin-top:4px">${num(st.weekend*100)} % am Wochenende.</div>

  if (st.longest){

    <p class="help">Erfasst seit ${fdate(new Date(st.since*1000))}. Nur PC, Konsolen liefern keine Sessions.</p></section></div>`;
  $("#view").innerHTML = h;
}

function renderTier(){
  const q = norm(S.lib.tq||"");
  const played = S.groups.filter(g=>g.minutes>0 || g.tier).sort((a,b)=>b.minutes-a.minutes);
  const pool = played.filter(g=>!g.tier && (!q || g.key.includes(q)));
  const item = g => `<div class="titem" data-k="${esc(g.key)}" title="${esc(g.title)}"><div class="poster">${img(g.covers,g.title)}</div></div>`;
  $("#view").innerHTML = `<div class="eyebrow" style="margin-top:6px">Deine Bibliothek</div><div class="h1">Tier-Liste</div>${libSeg()}
    <p class="help" style="margin-top:-6px">${matchMedia("(pointer:fine)").matches?"Cover in eine Reihe ziehen. Antippen öffnet das Spiel.":"Cover antippen und Rang wählen."}</p>
    ${TIERS.map(([t,c])=>`<div class="tierrow"><div class="tl" style="background:${c}">${t}</div><div class="tz" data-tier="${t}">${played.filter(g=>g.tier===t).map(item).join("")}</div></div>`).join("")}
    <div class="secttl" style="margin-top:20px">Noch nicht eingeordnet (${pool.length})</div>
    <div class="toolbar"><input id="tq" type="search" placeholder="Spiel suchen …" value="${esc(S.lib.tq||"")}"></div>
    <div class="tpool" data-tier="">${pool.slice(0, S.lib.tlimit||80).map(item).join("") || `<span class="help">Alles eingeordnet!</span>`}</div>
    ${pool.length > (S.lib.tlimit||80) ? `<button class="btn ghost more" onclick="S.lib.tlimit=(S.lib.tlimit||80)+120;renderTier()">Mehr anzeigen</button>`:""}`;
  $("#tq").oninput = e => { S.lib.tq = e.target.value; const pos = e.target.selectionStart; renderTier(); const el=$("#tq"); el.focus(); el.setSelectionRange(pos,pos); };
  document.querySelectorAll(".titem").forEach(el => {
    el.ondragstart = e => e.preventDefault();
    el.onpointerdown = e => {
      if (e.button !== 0) return;
      const sx = e.clientX, sy = e.clientY, mouse = e.pointerType === "mouse";
      let ghost = null, zone = null;
      const move = ev => {
        if (!ghost){
          if (!mouse || Math.hypot(ev.clientX-sx, ev.clientY-sy) < 6) return;
          ghost = el.cloneNode(true); el.style.opacity = ".3";
          ghost.style.cssText = `position:fixed;z-index:200;pointer-events:none;width:${el.offsetWidth}px;transform:rotate(-4deg) scale(1.08);filter:drop-shadow(0 12px 24px #000a)`;
          document.body.appendChild(ghost);
        }
        ghost.style.left = (ev.clientX - el.offsetWidth/2) + "px"; ghost.style.top = (ev.clientY - el.offsetHeight/2) + "px";
        const z = document.elementFromPoint(ev.clientX, ev.clientY)?.closest(".tz,.tpool");
        if (z !== zone){ zone && zone.classList.remove("over"); zone = z; zone && zone.classList.add("over"); }
      };
      const up = () => {
        removeEventListener("pointermove", move); removeEventListener("pointerup", up); removeEventListener("pointercancel", up);
        if (!ghost) return tierPick(el.dataset.k);
        ghost.remove(); el.style.opacity = ""; zone && zone.classList.remove("over");
        if (zone && (zone.dataset.tier || null) !== (S.gmap.get(el.dataset.k).tier || null)) setTier(el.dataset.k, zone.dataset.tier || null, false);
      };
      addEventListener("pointermove", move); addEventListener("pointerup", up); addEventListener("pointercancel", up);
    };
  });
}

  const g = S.gmap.get(key); if (!g) return;
  $("#pickerBody").innerHTML = `<button class="ibtn dclose" onclick="$('#picker').close()">✕</button><div class="pk">
    <div class="slot" style="width:150px"><div class="poster">${img(g.covers,g.title)}</div></div>
    <h2>${esc(g.title)}</h2><div class="why">${g.minutes?hrs(g.minutes)+" gespielt":""}</div>
    <div class="tpick" style="justify-content:center">${TIERS.map(([t,c])=>`<button style="background:${c}" class="${g.tier===t?"on":""}" onclick="setTier('${esc(key)}','${t}',false).then(()=>$('#picker').close())">${t}</button>`).join("")}</div>

/* ================= Reihen (Franchises) ================= */
const STOP = new Set(["the","of","a","an","and","s","der","die","das","edition","game","games","tom"]);
function franchiseKey(g){
  const t = g.key.split(" ").filter(w => w.length > 1 && !STOP.has(w));
  if (!t.length) return null;
  if (t.length === 1 || /^(\d+|[ivx]+)$/.test(t[1])) return t[0].length >= 4 ? t[0] : null;
  return t[0] + " " + t[1];
}
function franchises(list, val){
  const m = new Map();
  for (const g of list){ const k = franchiseKey(g); if (!k) continue; const e = m.get(k) || {k, games:[], minutes:0}; e.games.push(g); e.minutes += val(g); m.set(k, e); }
  const out = [...m.values()].filter(f => f.games.length >= 2);
  for (const f of out){
    // Anzeigename: gemeinsamer Wort-Anfang der Originaltitel
    const words = f.games.map(g => g.title.replace(/[™®©]/g,"").split(/\s+/));
    let n = 0; while (words.every(w => w[n] && w[n].toLowerCase().replace(/[:\-–]$/,"") === words[0][n].toLowerCase().replace(/[:\-–]$/,""))) n++;
    f.name = n ? words[0].slice(0, n).join(" ").replace(/[:\-–]$/,"") : f.games[0].title;
  }
  return out.sort((a,b)=>b.minutes-a.minutes);
}

  const maxG = played.reduce((m,g)=>Math.max(m,g.minutes),0);
  let early = 0; for (const [,s] of st.ss){ const h = new Date(s*1000).getHours(); if (h>=5 && h<9) early++; }
  const gen = {}; for (const g of played) for (const x of g.genres) gen[x]=(gen[x]||0)+g.pcMinutes;
  const ach = Object.values((S.data.steam||{}).ach||{});
  const rare = ach.reduce((m,a)=>a.r && a.r[1]!=null ? Math.min(m,a.r[1]) : m, 101);
  const devs = new Set(played.flatMap(g=>Object.keys(g.devs)));
  const dev = {}; for (const g of played) for (const [k,v] of Object.entries(g.devs)) dev[k] = (dev[k]||0) + v;
  const genAll = {}; for (const g of played) for (const x of g.genres) genAll[x.toLowerCase()] = (genAll[x.toLowerCase()]||0) + g.pcMinutes;
  const gsum = k => Object.entries(genAll).filter(([n])=>n.includes(k)).reduce((s,[,v])=>s+v,0);
  const pcTot = Object.values(genAll).length ? Math.max(...Object.values(genAll)) : 0;
  const decades = new Set(played.filter(g=>g.year).map(g=>Math.floor(g.year/10)));
  let midnight = 0; for (const [, s, sec] of st.ss){ const a = new Date(s*1000), b = new Date((s+sec)*1000); if (a.getDate() !== b.getDate()) midnight++; }
  const fr = franchises(played, g=>g.minutes);

  const cnt = st2 => S.groups.filter(g=>g.status===st2 && g.pc).length;
  const extra = {dev, shooter: gsum("shoot"), rpg: gsum("role") + gsum("rpg"), indie: gsum("indie"), strategy: gsum("strateg"),

    notes: S.groups.filter(g=>g.meta.note).length, sessions: st.ss.length, ten: played.filter(g=>g.minutes>=600).length,
    genreTop: pcTot, pcAll: played.reduce((s2,g)=>s2+g.pcMinutes,0)};
  return {...extra, st, total, maxG, early, doneYear: doneInYear(y).length, comp: S.groups.filter(g=>g.pc&&g.status==="komplett").length,
    devCount: devs.size, groups: S.groups.length, retro: played.filter(g=>g.year && g.year<2005).reduce((m,g)=>Math.max(m,g.minutes),0),
    genres5: Object.values(gen).filter(v=>v>=300).length, rated: S.groups.filter(g=>g.meta.rating).length,
    tiered: S.groups.filter(g=>g.tier).length, gourmet: played.filter(g=>(g.critic||0)>=90).length,
    trash: played.some(g=>g.critic && g.critic<60 && g.minutes>=300) ? 1 : 0,
    gems: played.filter(g=>g.rev && g.rev.pct>=95 && g.rev.total>=500).length, achTotal: ach.reduce((s,a)=>s+a.d,0), rare, topShare: total ? maxG/total : 0,

}

  el.className = `wslide enter ${sl.cls||""}`; el.style.background = sl.bg; el.style.color = sl.fg || "#fff"; el.innerHTML = sl.html;
  slot.appendChild(el); splitWords(el);
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.remove("enter")));
  document.querySelectorAll(".wbars i b").forEach((b,i)=>b.style.width = i < W.i ? "100%" : "0");
  setTimeout(()=>animate(el), 300);
  if (sl.confetti) setTimeout(confetti, 1300);
  el.querySelectorAll("[data-act]").forEach(b=>b.onclick = e => { e.stopPropagation(); if (b.dataset.act==="share") shareWrapped(); else { W.i = 0; wShow(); } });
  W.t0 = performance.now(); W.elapsed = 0; cancelAnimationFrame(W.raf);
  const bar = document.querySelectorAll(".wbars i b")[W.i];
  const tick = t => {
    if (!$("#wrap").classList.contains("open")) return;
    if (!W.paused) W.elapsed = t - W.t0;
    const p = Math.min(1, W.elapsed / W.DUR); bar.style.width = (p*100) + "%";
    if (p >= 1 && !sl.final) return wGo(1);
    W.raf = requestAnimationFrame(tick);
  };
  W.raf = requestAnimationFrame(tick);
}

  S.data.meta[m.key] = {status:m.status, rating:m.rating, note:m.note, tier:m.tier, hide:m.hide, updated:m.updated};
  buildGroups();
}

let flushing = false;
async function flushEdits(){
  if (!CLOUD || flushing || !S.snap || !S.snap.gh) return;
  const q = edits().filter(e=>!e.sent); if (!q.length) return;
  flushing = true;
  try {
    const {repo, token, branch} = S.snap.gh, ts = Date.now();
    const body = await encryptObj({edits:q}, pass());
    const name = `edits/${ts}-${Math.random().toString(36).slice(2,8)}.enc`;
    const r = await fetch(`https://api.github.com/repos/${repo}/contents/${name}`, {method:"PUT",
      headers:{"Authorization":"Bearer "+token,"Accept":"application/vnd.github+json","Content-Type":"application/json"},
      body: JSON.stringify({message:"Änderung vom Handy", content:btoa(unescape(encodeURIComponent(body))), branch})});
    if (r.ok){ const sent = new Set(q.map(e=>e.ts)); store.set("gr_edits", edits().map(e=>sent.has(e.ts)?{...e,sent:true}:e)); }
  } catch(e){ /* offline: später nochmal */ }
  finally { flushing = false; header(); }
}

    <p class="help" style="margin-top:-8px">Alles bleibt auf diesem PC (Ordner <code>daten</code>). Die Handy-App bekommt nur eine verschlüsselte Kopie.</p>
    ${srcs.length?`<fieldset><legend>Status</legend>${srcs.map(([n,v])=>`<div class="src"><span class="${v.ok?"ok":"bad"}">${v.ok?"●":"✕"}</span><span><b>${esc(n)}</b> <span class="help">${v.ok?esc(v.info||(v.count!=null?v.count+" Spiele":"ok")):esc(v.error)}</span></span></div>`).join("")}</fieldset>`:""}

    <fieldset><legend>📱 Handy-App (auch wenn der PC aus ist)</legend>
      <label class="check"><input type="checkbox" id="cloud_enabled" ${c.cloud_enabled?"checked":""}> Verschlüsselte Kopie auf GitHub Pages ablegen</label>
      ${cl.url && c.cloud_enabled ? `<div class="urlbox">${esc(cl.url)}</div><p class="help">Diese Adresse auf dem Handy öffnen und „Zum Home-Bildschirm hinzufügen“.</p>`:""}
      ${cl.error ? `<p class="bad" style="font-weight:700">${esc(cl.error)}</p>` : cl.last_push ? `<p class="help">Zuletzt hochgeladen: ${esc(cl.last_push.replace("T"," ").slice(0,16))} UTC</p>`:""}
      <label>Repository (benutzername/gaming-recap)</label><input type="text" id="gh_repo" value="${esc(c.gh_repo)}" placeholder="marvin/gaming-recap">
      <label>GitHub-Token</label><input type="password" id="gh_token" placeholder="${ph2(c.gh_token_set)}" autocomplete="off">
      <label>Passwort für die Handy-App (mind. 10 Zeichen)</label><input type="password" id="cloud_pass" placeholder="${ph2(c.cloud_pass_set)}" autocomplete="new-password">
      <div class="help"><ol>
        <li>Auf <a href="https://github.com/signup" target="_blank" rel="noopener">github.com</a> ein Konto anlegen.</li>
        <li><a href="https://github.com/new" target="_blank" rel="noopener">Neues Repository</a>: Name <code>gaming-recap</code>, <b>Public</b>, „Add a README file“ anhaken.</li>
        <li>Im Repository: Settings › Pages › Branch <code>main</code> / <code>/(root)</code> › Save.</li>
        <li><a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">Token erstellen</a>: „Only select repositories“ › gaming-recap, Permissions › Contents: <b>Read and write</b>.</li>
        <li>Alles hier eintragen und speichern.</li></ol>
        Das Repository ist öffentlich, deine Daten darin sind aber mit dem Passwort verschlüsselt. Nimm ein Passwort, das du sonst nirgends nutzt. Der Token steckt verschlüsselt in der Kopie, damit das Handy Änderungen zurückschicken kann.</div>
      ${c.cloud_enabled?`<button class="btn ghost small" type="button" id="pushBtn" style="margin-top:10px">Jetzt hochladen</button>`:""}
    </fieldset>

    <fieldset><legend>🖥️ Playnite (alle PC-Launcher)</legend>
      <div class="src">${c.playnite_found?`<span class="ok">●</span> Playnite gefunden`:`<span class="bad">✕</span> Playnite nicht gefunden – <a href="https://playnite.link" target="_blank" rel="noopener">playnite.link</a>`}</div>
      <div class="src">${c.extension_installed?`<span class="ok">●</span> Erweiterung installiert`:`<span class="bad">✕</span> Erweiterung fehlt`}</div>
      <button class="btn ghost small" type="button" id="instBtn" style="margin-top:8px" ${c.playnite_found?"":"disabled"}>${c.extension_installed?"Erweiterung neu installieren":"Erweiterung installieren"}</button>
      <div class="help">Danach Playnite einmal neu starten. In Playnite unter <i>Bibliothek › Bibliotheken konfigurieren</i> Steam, Epic, Ubisoft, EA, GOG und Xbox verbinden.</div>
      <label>Pfad zum Export</label><input type="text" id="playnite_export" value="${esc(c.playnite_export)}">
    </fieldset>
    <fieldset><legend>⏱️ Session-Tracker & Spieldauern</legend>
      <label class="check"><input type="checkbox" id="tracker" ${c.tracker?"checked":""}> Laufende PC-Spiele erkennen und Sessions speichern</label>
      <div class="help">${c.tracker_supported?"Funktioniert, solange Gaming Recap läuft. Tipp: Autostart einrichten (siehe Anleitung).":"Nur unter Windows verfügbar."} Änderung wirkt nach einem Neustart.</div>
      <label class="check" style="margin-top:12px"><input type="checkbox" id="hltb" ${c.hltb?"checked":""}> Spieldauern („Time to Beat“) und Cover von IGDB laden</label>
      <label>IGDB Client-ID</label><input type="text" id="igdb_client_id" value="${esc(c.igdb_client_id||"")}" autocomplete="off">
      <label>IGDB Client-Secret</label><input type="password" id="igdb_client_secret" placeholder="${ph2(c.igdb_client_secret_set)}" autocomplete="off">
      <div class="help"><ol><li>Auf <a href="https://dev.twitch.tv/console" target="_blank" rel="noopener">dev.twitch.tv/console</a> mit deinem Twitch-Konto anmelden (Zwei-Faktor-Schutz muss an sein).</li>
        <li>„Register Your Application“: Name z. B. <code>Gaming Recap Marvin</code>, OAuth Redirect URL <code>http://localhost</code>, Kategorie „Application Integration“, Client-Typ „Confidential“.</li>
        <li>Client-ID kopieren, „New Secret“ klicken, Secret kopieren, beides hier eintragen.</li></ol>
        Offizielle, kostenlose Schnittstelle. Ohne Zugang kannst du Spieldauern pro Spiel selbst eintragen.</div>
    </fieldset>
    <fieldset><legend>Steam</legend>
      <label>Steam Web-API-Key</label><input type="password" id="steam_api_key" placeholder="${ph2(c.steam_api_key_set)}" autocomplete="off">
      <label>Steam-Profil (Link, ID oder Name)</label><input type="text" id="steam_id" value="${esc(c.steam_id)}" placeholder="https://steamcommunity.com/id/deinname">
      <div class="help">Key: <a href="https://steamcommunity.com/dev/apikey" target="_blank" rel="noopener">steamcommunity.com/dev/apikey</a> (Domain: <code>localhost</code>). In Steam unter Profil › Privatsphäre die „Spieldetails“ auf „Öffentlich“.</div>
    </fieldset>
    <fieldset><legend>PlayStation 5</legend>
      <label>NPSSO-Token</label><input type="password" id="psn_npsso" placeholder="${ph2(c.psn_npsso_set)}" autocomplete="off">
      <div class="help"><ol><li>Auf <a href="https://www.playstation.com" target="_blank" rel="noopener">playstation.com</a> anmelden.</li>
      <li>Im selben Browser <a href="https://ca.account.sony.com/api/v1/ssocookie" target="_blank" rel="noopener">diesen Link</a> öffnen.</li>
      <li>Den Wert hinter <code>"npsso"</code> einfügen.</li></ol>Wie ein Passwort behandeln. Hält ca. 2 Monate.</div>
    </fieldset>
    <fieldset><legend>Xbox Series X <span class="help">(experimentell)</span></legend>
      <label>OpenXBL-API-Key</label><input type="password" id="xbox_api_key" placeholder="${ph2(c.xbox_api_key_set)}" autocomplete="off">
      <div class="help"><ol><li>Auf <a href="https://xbl.io" target="_blank" rel="noopener">xbl.io</a> mit deinem Microsoft-Konto anmelden.</li>
      <li>Unter „API Keys“ einen Key erstellen und hier einfügen.</li></ol>Drittanbieter-Dienst. Spielzeiten kommen in Portionen.</div>
    </fieldset>
    <fieldset><legend>📚 Backlog</legend>
      <div class="help" style="margin-top:0">Welche PC-Stores zählen in deinen Backlog? Konsolen und geliehene Spiele sind nie dabei.</div>
      ${[...new Set([...DEFAULT_BL_STORES, ...S.data.games.filter(g=>g.device==="PC").map(g=>g.store)])].map(st=>`<label class="check" style="margin-top:8px"><input type="checkbox" class="blstore" value="${esc(st)}" ${backlogStores().includes(st)?"checked":""}> ${esc(st)}</label>`).join("")}
    </fieldset>
    <fieldset><legend>🔔 Extras & Hinweise</legend>
      <label class="check"><input type="checkbox" id="steam_extras" ${c.steam_extras?"checked":""}> Steam-Erfolge, Wunschliste, Preise und Freunde laden</label>
      <label class="check" style="margin-top:10px"><input type="checkbox" id="notify_sales" ${c.notify_sales?"checked":""}> Windows-Hinweis bei Angeboten auf der Wunschliste</label>
      <label class="check" style="margin-top:10px"><input type="checkbox" id="notify_weekly" ${c.notify_weekly?"checked":""}> Wochen-Recap jeden Montag</label>
      <label>Pausen-Erinnerung nach … Stunden am Stück (0 = aus)</label><input type="number" id="pause_hours" min="0" max="24" step="0.5" value="${c.pause_hours||0}">
      <label>Leistung deines PCs beim Zocken (Watt, für die Stromrechnung)</label><input type="number" id="watts" min="50" max="2000" value="${c.watts||350}">
      <label>Strompreis (€ pro kWh)</label><input type="number" id="kwh_price" min="0" max="5" step="0.01" value="${c.kwh_price||0.35}">
    </fieldset>
    <fieldset><legend>Sonstiges</legend>
      <label>Automatisch abgleichen alle … Stunden</label><input type="number" id="sync_hours" min="1" max="48" value="${c.sync_hours}">
      <label class="check" style="margin-top:14px"><input type="checkbox" id="lan" ${c.lan?"checked":""}> Zusätzlich im Heim-WLAN freigeben</label>
      <div class="help">Brauchst du mit der Handy-App eigentlich nicht mehr. Wirkt nach einem Neustart.</div>
    </fieldset>
    <div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn ghost" type="button" onclick="$('#settings').close()">Abbrechen</button>
      <button class="btn limeb" type="button" id="saveBtn">Speichern</button></div>`;
  $("#instBtn").onclick = async () => {
    try { const r = await post("/api/playnite/install",{}); alert("Installiert nach:\n" + r.path + "\n\nStarte Playnite jetzt neu."); openSettings(); }
    catch(e){ alert(e.message); }
  };
  if ($("#pushBtn")) $("#pushBtn").onclick = async () => { await post("/api/cloud/push",{}); toast("Lade hoch …"); setTimeout(openSettings, 8000); };
  $("#saveBtn").onclick = async () => {
    $("#saveBtn").disabled = true;
    try {
      const v = id => $("#"+id).value, ch = id => $("#"+id).checked;
      await post("/api/config", {steam_api_key:v("steam_api_key"), steam_id:v("steam_id"), psn_npsso:v("psn_npsso"), xbox_api_key:v("xbox_api_key"),
        playnite_export:v("playnite_export"), gh_repo:v("gh_repo"), igdb_client_id:v("igdb_client_id"), igdb_client_secret:v("igdb_client_secret"), gh_token:v("gh_token"), cloud_pass:v("cloud_pass"),
        cloud_enabled:ch("cloud_enabled"), tracker:ch("tracker"), hltb:ch("hltb"), lan:ch("lan"), sync_hours:Number(v("sync_hours"))||6,
        backlog_stores:[...document.querySelectorAll(".blstore:checked")].map(e=>e.value),
        steam_extras:ch("steam_extras"), notify_sales:ch("notify_sales"), notify_weekly:ch("notify_weekly"),
        pause_hours:Number(v("pause_hours"))||0, watts:Number(v("watts"))||350, kwh_price:Number(v("kwh_price"))||0.35});
      $("#settings").close(); toast("Gespeichert"); setTimeout(load,400);
    } catch(e){ alert("Speichern fehlgeschlagen: " + e.message); $("#saveBtn").disabled = false; }
  };
  if (!$("#settings").open) $("#settings").showModal();
};

/* ================= Start ================= */
if (CLOUD && "serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
nav();
load();
if (LOCAL) setInterval(()=>{ if (!document.hidden && cur()!=="wrapped") fetch("/api/data?period="+S.period).then(r=>r.json()).then(d=>{
  const changed = JSON.stringify(d.playing) !== JSON.stringify(S.data && S.data.playing) || d.last_sync !== (S.data && S.data.last_sync);
  if (changed && !$("#detail").open && !$("#picker").open && !$("#settings").open){ S.data = d; buildGroups(); header(); route(); }
}).catch(()=>{}); }, 60000);
</script>
</body>
</html>
